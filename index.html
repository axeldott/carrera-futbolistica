<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fichas: Carrera de Fútbol</title>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --gold: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    #game-container {
      width: 100%;
      max-width: 760px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1, h2, h3 { color: #ffffff; margin-bottom: 14px; font-weight: 800; }
    h1 { font-size: 1.8rem; text-align: center; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.15rem; color: var(--accent); }

    p { line-height: 1.6; margin-bottom: 12px; color: var(--text-main); }
    hr { border: 0; border-top: 1px solid var(--border-color); margin: 20px 0; }

    .tarjeta-ficha {
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .ficha-juvenil {
      background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
      border: 1px solid #38bdf8;
    }

    .ficha-prime {
      background: linear-gradient(135deg, #14532d 0%, #16a34a 100%);
      border: 1px solid #4ade80;
    }

    .ficha-veterano {
      background: linear-gradient(135deg, #78350f 0%, #d97706 100%);
      border: 1px solid #fbbf24;
    }

    .badge-etapa {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .finanzas-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 8px;
      font-size: 0.88rem;
    }

    .progreso-carrera {
      display: flex;
      gap: 3px;
      margin-top: 10px;
    }

    .progreso-bloque {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .progreso-bloque.activo {
      background: #ffffff;
    }

    .cartel {
      border-radius: 8px;
      padding: 14px 18px;
      margin: 15px 0;
      border-left: 6px solid;
    }

    .cartel-titular {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .cartel-cuerpo {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .cartel-stats {
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: 6px;
      line-height: 1.6;
    }

    .cartel-oro {
      background: rgba(234, 179, 8, 0.15);
      border-color: #eab308;
      color: #fef08a;
    }

    .cartel-verde {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      color: #bbf7d0;
    }

    .cartel-azul {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #bfdbfe;
    }

    .cartel-rojo {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fecaca;
    }

    .cartel-moral {
      background: rgba(168, 85, 247, 0.15);
      border-left: 5px solid #a855f7;
      color: #e9d5ff;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 0;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .cartel-fisico {
      background: rgba(14, 165, 233, 0.15);
      border-left: 5px solid #0ea5e9;
      color: #bae6fd;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 0;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .cartel-mercado {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.2) 0%, rgba(180, 83, 9, 0.3) 100%);
      border-left: 5px solid #f59e0b;
      color: #fef08a;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 14px 0;
      line-height: 1.5;
    }

    .cartel-retiro {
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.25) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #ef4444;
      color: #fecaca;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }
