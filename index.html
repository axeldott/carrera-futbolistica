<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11 Fichas: Carrera de Fútbol</title>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --gold: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    #game-container {
      width: 100%;
      max-width: 760px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1, h2, h3 { color: #ffffff; margin-bottom: 14px; font-weight: 800; }
    h1 { font-size: 1.8rem; text-align: center; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.15rem; color: var(--accent); }

    p { line-height: 1.6; margin-bottom: 12px; color: var(--text-main); }
    hr { border: 0; border-top: 1px solid var(--border-color); margin: 20px 0; }

    .tarjeta-ficha {
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .ficha-juvenil {
      background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
      border: 1px solid #38bdf8;
    }

    .ficha-prime {
      background: linear-gradient(135deg, #14532d 0%, #16a34a 100%);
      border: 1px solid #4ade80;
    }

    .ficha-veterano {
      background: linear-gradient(135deg, #78350f 0%, #d97706 100%);
      border: 1px solid #fbbf24;
    }

    .badge-etapa {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .progreso-carrera {
      display: flex;
      gap: 4px;
      margin-top: 10px;
    }

    .progreso-bloque {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .progreso-bloque.activo {
      background: #ffffff;
    }

    .cartel {
      border-radius: 8px;
      padding: 14px 18px;
      margin: 15px 0;
      border-left: 6px solid;
    }

    .cartel-titular {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .cartel-cuerpo {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .cartel-stats {
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 12px;
      border-radius: 6px;
    }

    .cartel-oro {
      background: rgba(234, 179, 8, 0.15);
      border-color: #eab308;
      color: #fef08a;
    }

    .cartel-verde {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      color: #bbf7d0;
    }

    .cartel-azul {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #bfdbfe;
    }

    .cartel-amarillo {
      background: rgba(245, 158, 11, 0.15);
      border-color: #f59e0b;
      color: #fde68a;
    }

    .cartel-rojo {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fecaca;
    }

    .lista-opciones {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
    }

    button.btn-opcion {
      background-color: #1e3a8a;
      color: #ffffff;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.btn-opcion:hover {
      background-color: #2563eb;
      transform: translateY(-1px);
    }

    button.btn-primario {
      background-color: #0284c7;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
    }

    button.btn-primario:hover {
      background-color: #0369a1;
    }

    input[type="text"] {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      margin: 6px 0 16px 0;
    }

    .vitrina-box {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #eab308;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
    }

    .seleccion-box {
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid #3b82f6;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
    }

    .resurreccion-box {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      border: 2px solid #818cf8;
      border-radius: 8px;
      padding: 16px;
      margin: 15px 0;
    }

    .premios-box {
      background: linear-gradient(135deg, #451a03 0%, #78350f 100%);
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 14px;
      margin: 15px 0;
    }

    .tag-tier {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .tag-titulo-tier {
      font-size: 0.75rem;
      padding: 1px 6px;
      border-radius: 3px;
      margin-left: 6px;
      font-weight: 600;
    }
    .tt-tier1 { background: #b91c1c; color: #fee2e2; }
    .tt-tier2 { background: #c2410c; color: #ffedd5; }
    .tt-tier3 { background: #d97706; color: #fef3c7; }
    .tt-tier4 { background: #15803d; color: #dcfce7; }
    .tt-tier5 { background: #475569; color: #f1f5f9; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    // 1. SISTEMA DE 5 TIERS INTERNACIONALES (PAÍSES)
    const tier1 = ["España", "Francia", "Alemania", "Inglaterra", "Italia", "Argentina", "Brasil"];
    const tier2 = ["Portugal", "Países Bajos", "Uruguay", "Croacia", "Bélgica", "Colombia"];
    const tier3 = ["Marruecos", "Senegal", "México", "Estados Unidos", "Japón", "Chile", "Ecuador", "Polonia", "Turquía"];
    const tier4 = ["Nigeria", "Costa de Marfil", "Camerún", "Egipto", "Ghana", "Grecia", "Noruega", "Corea del Sur", "Australia", "Paraguay", "Perú"];
    const tier5 = ["Islandia", "Bolivia", "Venezuela", "Costa Rica", "Jamaica", "Honduras", "Panamá", "Argelia", "Mali", "Irán", "Catar", "Nueva Zelanda"];

    const paisesMundo = [...tier1, ...tier2, ...tier3, ...tier4, ...tier5];

    function obtenerTierPais(pais) {
      if (tier1.includes(pais)) return { tier: 1, nombre: "Tier 1: Gigante Mundial", minMediaSel: 74, probCont: 38, probMun: 26, probRes: 25, reqCont: 79, reqMun: 83 };
      if (tier2.includes(pais)) return { tier: 2, nombre: "Tier 2: Gran Potencia", minMediaSel: 74, probCont: 24, probMun: 14, probRes: 15, reqCont: 81, reqMun: 85 };
      if (tier3.includes(pais)) return { tier: 3, nombre: "Tier 3: Nación Competitiva", minMediaSel: 73, probCont: 14, probMun: 5, probRes: 7, reqCont: 83, reqMun: 87 };
      if (tier4.includes(pais)) return { tier: 4, nombre: "Tier 4: Selección Media", minMediaSel: 71, probCont: 7, probMun: 2, probRes: 3, reqCont: 85, reqMun: 89 };
      return { tier: 5, nombre: "Tier 5: País Modesto", minMediaSel: 69, probCont: 3, probMun: 1, probRes: 1, reqCont: 87, reqMun: 91 };
    }

    // 2. SISTEMA DE 5 TIERS DE DIFICULTAD DE TÍTULOS
    // Tier 1: Cúspide Imposible (Mundial, Champions)
    // Tier 2: Gloria Mayor (Liga, Continental Selecciones)
    // Tier 3: Éxito Continental & Intercontinental (Europa League, Mundial de Clubes)
    // Tier 4: Copa Doméstica
    // Tier 5: Supercopas (Nacional, UEFA)
    function tagTierTitulo(titulo) {
      if (titulo.includes("Mundial") || titulo.includes("Champions")) return `<span class="tag-titulo-tier tt-tier1">Tier 1: Cúspide</span>`;
      if (titulo.includes("Liga") || titulo.includes("Continental de Selecciones")) return `<span class="tag-titulo-tier tt-tier2">Tier 2: Mayor</span>`;
      if (titulo.includes("Europa League") || titulo.includes("Clubes de la FIFA")) return `<span class="tag-titulo-tier tt-tier3">Tier 3: Alta</span>`;
      if (titulo.includes("Copa Doméstica")) return `<span class="tag-titulo-tier tt-tier4">Tier 4: Media</span>`;
      return `<span class="tag-titulo-tier tt-tier5">Tier 5: Menor</span>`;
    }

    const listaPosiciones = [
      "Delantero Centro", "Extremo Izquierdo", "Extremo Derecho",
      "Mediapunta", "Centrocampista", "Pivote Defensivo",
      "Lateral Izquierdo", "Lateral Derecho", "Defensa Central", "Portero"
    ];

    const listaCanteras = [
      "Real Madrid (La Fábrica)", "FC Barcelona (La Masia)", "Atlético de Madrid", 
      "Athletic Club (Lezama)", "Real Sociedad (Zubieta)", "Valencia CF (Paterna)",
      "Manchester City", "Chelsea FC (Cobham)", "Arsenal FC (Hale End)", "Manchester United",
      "Bayern Múnich", "Borussia Dortmund", "Bayer Leverkusen",
      "Paris Saint-Germain", "Olympique de Lyon", "AS Mónaco",
      "Ajax de Ámsterdam", "PSV Eindhoven", "Feyenoord",
      "SL Benfica (Seixal)", "Sporting de Portugal (Alcochete)", "FC Porto",
      "Juventus", "AC Milan", "Inter de Milán", "Atalanta",
      "River Plate", "Boca Juniors", "Santos FC", "Flamengo"
    ];

    const clubesEuropaTop = [
      "Real Madrid", "FC Barcelona", "Manchester City", "Liverpool FC", 
      "Arsenal FC", "Bayern Múnich", "Paris Saint-Germain", "Inter de Milán", 
      "Juventus", "Atlético de Madrid", "Borussia Dortmund"
    ];

    const clubesEuropaMedios = [
      "Bayer Leverkusen", "Chelsea FC", "Atalanta", "Manchester United", 
      "Tottenham Hotspur", "Aston Villa", "Newcastle United", "AC Milan", 
      "AS Roma", "SSC Napoli", "Sevilla FC", "Real Sociedad", "Athletic Club", 
      "SL Benfica", "Sporting de Portugal", "FC Porto", "Ajax de Ámsterdam"
    ];

    const clubesEuropaBajos = [
      "Valencia CF", "Real Betis", "Villarreal CF", "Girona FC", "Celta de Vigo",
      "West Ham United", "Brighton", "Everton FC", "Wolverhampton",
      "Eintracht Frankfurt", "VfB Stuttgart", "RB Leipzig", "Fiorentina", 
      "Lazio", "LOSC Lille", "AS Mónaco", "Feyenoord"
    ];

    const clubesExoticos = ["Al-Hilal", "Al-Nassr", "Inter Miami", "LA Galaxy", "Vissel Kobe"];

    let player = {
      nombre: "Álex Navarro",
      dorsal: 10,
      nacionalidad: "",
      posicion: "",
      pieHabil: "",
      club: "",
      edad: 17,
      numeroFicha: 1,
      media: 67,
      titulosClub: 0,
      titulosSeleccion: 0,
      listaTitulos: [],
      partidosTotales: 0,
      golesTotales: 0,
      partidosSeleccion: 0,
      golesSeleccion: 0,
      porteriasCeroTotales: 0,
      balonesDeOro: 0,
      botasDeOro: 0,
      guantesDeOro: 0,
      vecesOnceIdeal: 0,
      pichichisLiga: 0,
      pichichisChampions: 0,
      pichichisMundial: 0,
      listaPremiosIndiv: []
    };

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function pickDistinct(arr, count) {
      const copy = [...arr];
      const res = [];
      for (let i = 0; i < count; i++) {
        if (!copy.length) break;
        const idx = Math.floor(Math.random() * copy.length);
        res.push(copy.splice(idx, 1)[0]);
      }
      return res;
    }

    // Modificador de dificultad para subidas de media: cuanto más alta es, más cuesta progresar
    function aplicarDeltaMedia(delta) {
      if (delta > 0) {
        if (player.media >= 88) {
          // A partir de 88 solo sube 1 punto si el delta era 2 o más
          delta = (delta >= 2) ? 1 : 0;
        } else if (player.media >= 83 && delta >= 3) {
          delta = 2;
        }
      }
      player.media = Math.min(99, Math.max(40, player.media + delta));
    }

    const container = document.getElementById("game-container");

    function renderStart() {
      container.innerHTML = `
        <h1>⚽ 11 FICHAS: CARRERA DE FÚTBOL</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">Edición Realista: Exigencia, Tiers de Títulos y Progresión Fina</p>
        <p>Vive una trayectoria profesional de 20 años a lo largo de <strong>11 etapas bianuales</strong> (17 a 37 años).</p>
        <p>Subir de media y consolidarse en los 85+ o 90+ exige temporadas brillantes. Además, conquistar cada título responde a su prestigio real:</p>
        <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin: 15px 0; font-size: 0.88rem; line-height: 1.6;">
          🏆 <strong>Tier List de Dificultad de Trofeos:</strong><br>
          • <span class="tag-titulo-tier tt-tier1">Tier 1: Cúspide</span> <strong>Champions League & Copa del Mundo</strong> (Dificultad Extrema).<br>
          • <span class="tag-titulo-tier tt-tier2">Tier 2: Mayor</span> <strong>Liga Nacional & Eurocopa / Copa América</strong> (Dificultad Muy Alta).<br>
          • <span class="tag-titulo-tier tt-tier3">Tier 3: Alta</span> <strong>UEFA Europa League & Mundial de Clubes</strong> (Dificultad Alta).<br>
          • <span class="tag-titulo-tier tt-tier4">Tier 4: Media</span> <strong>Copa Doméstica</strong> (El torneo del KO para clubes competitivos).<br>
          • <span class="tag-titulo-tier tt-tier5">Tier 5: Menor</span> <strong>Supercopas Nacionales y Europeas</strong>.
        </div>
        <hr>
        <button class="btn-primario" onclick="renderNacionalidad()">Comenzar tu carrera profesional</button>
      `;
    }

    function renderNacionalidad() {
      const opciones = pickDistinct(paisesMundo, 3);
      container.innerHTML = `
        <h3>🌍 Paso 1: País de Nacimiento</h3>
        <p>¿Bajo qué bandera darás tus primeros toques al balón?</p>
        <div class="lista-opciones">
          ${opciones.map(p => {
            const tInfo = obtenerTierPais(p);
            return `<button class="btn-opcion" onclick="elegirNacionalidad('${p}')">
              Nacer en <strong>${p}</strong> <span class="tag-tier">${tInfo.nombre}</span>
            </button>`;
          }).join('')}
        </div>
      `;
    }

    function elegirNacionalidad(p) {
      player.nacionalidad = p;
      renderPosicion();
    }

    function renderPosicion() {
      const opciones = pickDistinct(listaPosiciones, 3);
      container.innerHTML = `
        <h3>🏃 Paso 2: Posición en el Campo</h3>
        <p><strong>Nacionalidad:</strong> ${player.nacionalidad} (${obtenerTierPais(player.nacionalidad).nombre})</p>
        <p>¿Cuál es tu rol natural sobre el terreno de juego?</p>
        <div class="lista-opciones">
          ${opciones.map(pos => `<button class="btn-opcion" onclick="elegirPosicion('${pos}')">Jugar de <strong>${pos}</strong></button>`).join('')}
        </div>
      `;
    }

    function elegirPosicion(pos) {
      player.posicion = pos;
      renderPie();
    }

    function renderPie() {
      container.innerHTML = `
        <h3>👟 Paso 3: Perfil y Pierna Hábil</h3>
        <p><strong>Nacionalidad:</strong> ${player.nacionalidad} | <strong>Posición:</strong> ${player.posicion}</p>
        <div class="lista-opciones">
          <button class="btn-opcion" onclick="elegirPie('Diestro')">Pierna derecha (Diestro)</button>
          <button class="btn-opcion" onclick="elegirPie('Zurdo')">Pierna izquierda (Zurdo)</button>
          <button class="btn-opcion" onclick="elegirPie('Ambidiestro')">Dominio de ambas piernas (Ambidiestro)</button>
        </div>
      `;
    }

    function elegirPie(pie) {
      player.pieHabil = pie;
      renderDatos();
    }

    function renderDatos() {
      const defDorsal = randomInt(1, 99);
      container.innerHTML = `
        <h3>✍️ Paso 4: Identidad y Dorsal</h3>
        <p><strong>Nacionalidad:</strong> ${player.nacionalidad} | <strong>Posición:</strong> ${player.posicion} | <strong>Pierna:</strong> ${player.pieHabil}</p>
        <label>Nombre de futbolista:</label>
        <input type="text" id="inputNombre" value="Álex Navarro">
        <label>Dorsal predilecto:</label>
        <input type="text" id="inputDorsal" value="${defDorsal}">
        <button class="btn-primario" onclick="guardarDatos()">Firmar ficha y buscar academia</button>
      `;
    }

    function guardarDatos() {
      const n = document.getElementById("inputNombre").value.trim();
      const d = parseInt(document.getElementById("inputDorsal").value.trim(), 10);
      if (n) player.nombre = n;
      if (!isNaN(d)) player.dorsal = d;
      renderCantera();
    }

    function renderCantera() {
      const opciones = pickDistinct(listaCanteras, 3);
      container.innerHTML = `
        <h3>🏟 Paso 5: Academia de Formación</h3>
        <p><strong>Futbolista:</strong> ${player.nombre} (#${player.dorsal}) | ${player.posicion}</p>
        <p>Tres academias formativas evalúan incorporarte con 17 años recién cumplidos:</p>
        <div class="lista-opciones">
          ${opciones.map(c => `<button class="btn-opcion" onclick="elegirCantera('${c}')">Formarte en la cantera de <strong>${c}</strong></button>`).join('')}
        </div>
      `;
    }

    function elegirCantera(c) {
      player.club = c;
      player.edad = 17;
      player.numeroFicha = 1;
      player.media = randomInt(63, 69); // Media inicial más contenida
      renderFichaInicial();
    }

    function renderFichaInicial() {
      const tInfo = obtenerTierPais(player.nacionalidad);
      container.innerHTML = `
        <h3>📋 Ficha Inicial Oficial: Inicio de Carrera</h3>
        <div style="background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 18px; margin: 15px 0; line-height: 1.8;">
          <p><strong>Nombre:</strong> ${player.nombre} (#${player.dorsal})</p>
          <p><strong>Nacionalidad:</strong> ${player.nacionalidad} <span class="tag-tier">${tInfo.nombre}</span></p>
          <p><strong>Posición:</strong> ${player.posicion} | <strong>Pierna:</strong> ${player.pieHabil}</p>
          <p><strong>Club inicial:</strong> ${player.club}</p>
          <p><strong>Edad inicial:</strong> 17 años</p>
          <p><strong>Media inicial de salida:</strong> ${player.media} / 99</p>
        </div>
        <p>El cuerpo técnico te convoca con el filial y te da minutos en el primer equipo.</p>
        <button class="btn-primario" onclick="simularFicha()">Debut profesional: Saltar al césped (Ficha 1)</button>
      `;
    }

    function simularFicha() {
      let claseFicha = "ficha-juvenil";
      let nombreEtapa = "JUVENIL // PROMESA";
      if (player.numeroFicha > 7) {
        claseFicha = "ficha-veterano";
        nombreEtapa = "VETERANO // LEYENDA";
      } else if (player.numeroFicha > 3) {
        claseFicha = "ficha-prime";
        nombreEtapa = "PRIME // ÉLITE MUNDIAL";
      }

      const suerte = randomInt(1, 100);
      let nuevosTitulos = [];
      let porteriasCero = 0;
      const esAtacante = (player.posicion.includes("Delantero") || player.posicion.includes("Extremo") || player.posicion.includes("Mediapunta"));
      const esClubChampions = clubesEuropaTop.includes(player.club);
      const esClubEuropaLeague = clubesEuropaMedios.includes(player.club);

      let subida = 0;
      let partidos = 0;
      let goles = 0;
      let htmlRendimiento = "";

      // ESCALADO DE PROGRESIÓN MÁS EXIGENTE
      if (suerte >= 82) {
        // Año estelar: subidas de +3 a +5 en jóvenes, +1 a +2 en prime
        subida = (player.numeroFicha <= 3) ? randomInt(3, 5) : ((player.numeroFicha <= 7) ? randomInt(1, 3) : randomInt(0, 1));
        aplicarDeltaMedia(subida);
        partidos = randomInt(60, 74);

        if (player.posicion === "Portero") {
          goles = 0;
          porteriasCero = randomInt(24, 36);
          player.porteriasCeroTotales += porteriasCero;
        } else if (player.posicion.includes("Defensa") || player.posicion.includes("Lateral")) {
          goles = randomInt(1, 3);
          porteriasCero = randomInt(20, 32);
          player.porteriasCeroTotales += porteriasCero;
        } else if (player.posicion.includes("Pivote")) {
          goles = randomInt(2, 6);
        } else if (player.posicion.includes("Centro")) {
          goles = randomInt(8, 14);
        } else if (player.posicion.includes("Mediapunta")) {
          goles = randomInt(12, 20);
        } else {
          goles = randomInt(30, 46);
        }

        htmlRendimiento = `
          <div class="cartel cartel-oro">
            <div class="cartel-titular">🌟 TEMPORADA MAGISTRAL</div>
            <div class="cartel-cuerpo">Rendimiento determinante en las noches clave. Marcas diferencias y tu estatus continental se dispara.</div>

          `;
        }
      } else if (player.numeroFicha <= 7) {
        const azarPrime = randomInt(1, 4);
        if (azarPrime === 1 && player.media >= 83) {
          htmlOpciones = `
            <div style="background: linear-gradient(135deg, rgba(234, 179, 8, 0.25) 0%, rgba(15, 23, 42, 0.9) 100%); border-left: 5px solid #facc15; padding: 14px; margin: 15px 0;">
              🔥 <strong>¡TERREMOTO EN ESPAÑA: EL CLÁSICO A TUS PIES!</strong><br>
              El <strong>Real Madrid</strong> y el <strong>FC Barcelona</strong> depositan tu cláusula de rescisión a la vez.
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarDecision({club: 'Real Madrid'})">Fichar por el <strong>Real Madrid</strong> (El rey de Europa y asalto al Balón de Oro)</button>
              <button class="btn-opcion" onclick="ejecutarDecision({club: 'FC Barcelona'})">Fichar por el <strong>FC Barcelona</strong> (El estilo legendario y liderar el proyecto)</button>
              <button class="btn-opcion" onclick="ejecutarDecision({mediaDelta: 1})">Rechazar a ambos y ser la leyenda del <strong>${player.club}</strong> (+1 de media)</button>
            </div>
          `;
        } else if (azarPrime === 2) {
          htmlOpciones = `
            <div style="background: rgba(14, 165, 233, 0.15); border-left: 4px solid #0ea5e9; padding: 14px; margin: 15px 0;">
              🏴󠁧󠁢󠁥󠁮󠁧󠁿 <strong>BATALLA EN INGLATERRA</strong><br>
              Propuestas astronómicas del <strong>Manchester City</strong> y del <strong>Arsenal FC</strong>.
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarDecision({club: 'Manchester City'})">Fichar por el <strong>Manchester City</strong> (Fútbol total y plantilla galáctica)</button>
              <button class="btn-opcion" onclick="ejecutarDecision({club: 'Arsenal FC'})">Fichar por el <strong>Arsenal FC</strong> (Liderar a los Gunners a la gloria)</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Seguir defendiendo el escudo del <strong>${player.club}</strong></button>
            </div>
          `;
        } else if (azarPrime === 3) {
          htmlOpciones = `
            <div style="background: rgba(245, 158, 11, 0.15); border-left: 4px solid #f59e0b; padding: 14px; margin: 15px 0;">
              ⚔ <strong>EL JUGADOR TOTAL: PRESIÓN EN PLENO PRIME</strong><br>
              El míster te pide liderar la presión arriba sin perder pólvora en ataque.<br>
              <small style="color: #94a3b8;">(Prime: 65% consagrarte como jugador total +1 / 35% llegar fundido a final de curso -1)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarPresionPrime()">Comprometerte al 100% en tareas defensivas</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Priorizar tu frescura ofensiva y desentenderte del repliegue</button>
            </div>
          `;
        } else {
          htmlOpciones = `
            <div style="background: rgba(16, 185, 129, 0.15); border-left: 4px solid #10b981; padding: 14px; margin: 15px 0;">
              🥩 <strong>PLAN DE NUTRICIÓN MOLECULAR Y LONGEVIDAD</strong><br>
              Afinar tu porcentaje graso al milímetro para prolongar tu pico de rendimiento.<br>
              <small style="color: #94a3b8;">(Riesgo: 70% éxito +1 / 30% bajón energético -1)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarDieta()">Someterte a la dieta estricta</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Seguir con tus hábitos habituales</button>
            </div>
          `;
        }
      } else {
        const azarVet = randomInt(1, 4);
        if (azarVet === 1) {
          htmlOpciones = `
            <div style="background: rgba(245, 158, 11, 0.15); border-left: 4px solid #f59e0b; padding: 14px; margin: 15px 0;">
              🌟 <strong>CAPITÁN Y MENTOR DE LA CANTERA (${player.edad} años)</strong><br>
              Ha irrumpido una joya de 17 años al primer equipo. El club te pide ser su tutor en el vestuario.<br>
              <small style="color: #94a3b8;">(Riesgo: 75% éxito de liderazgo +1 / 25% fricción y perder -1)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarMentor()">Aceptar ser su mentor (Transmitir tus galones)</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Rechazarlo: en el fútbol profesional cada uno debe ganarse su puesto</button>
            </div>
          `;
        } else if (azarVet === 2) {
          htmlOpciones = `
            <div style="background: rgba(239, 68, 68, 0.15); border-left: 4px solid #ef4444; padding: 14px; margin: 15px 0;">
              🛑 <strong>EL DESGASTE DE LOS AÑOS: ¿DEFENDER A TUS ${player.edad} AÑOS?</strong><br>
              El míster pide presión alta constante. A tu edad, forzar sprints continuos castiga tus rodillas e isquios.<br>
              <small style="color: #94a3b8;">(Veteranía: 40% admiración +1 / 60% rotura muscular y perder -2 de media)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarPresionVeterano()">Forzar la máquina y presionar como un canterano más</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Dosificar inteligentemente y jugar con la cabeza</button>
            </div>
          `;
        } else if (azarVet === 3) {
          const exotico = pickRandom(clubesExoticos);
          const modesto = pickRandom(clubesEuropaBajos);
          htmlOpciones = `
            <div style="background: rgba(148, 163, 184, 0.15); border-left: 4px solid #94a3b8; padding: 14px; margin: 15px 0;">
              ⌛ <strong>RECTA FINAL DE CARRERA:</strong> El club prepara la transición y hay ofertas sobre la mesa.
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarDecision({club: '${exotico}'})">Aceptar un retiro dorado en el <strong>${exotico}</strong> (Contrato multimillonario)</button>
              <button class="btn-opcion" onclick="ejecutarDecision({club: '${modesto}'})">Fichar por un club modesto como el <strong>${modesto}</strong> (Aportar tu jerarquía)</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Pelear por tu puesto y quedarte hasta el final en el <strong>${player.club}</strong></button>
            </div>
          `;
        } else {
          htmlOpciones = `
            <div style="background: rgba(16, 185, 129, 0.15); border-left: 4px solid #10b981; padding: 14px; margin: 15px 0;">
              🥗 <strong>PLAN DE REGENERACIÓN FÍSICA PARA VETERANOS</strong><br>
              A tus ${player.edad} años, te ofrecen un protocolo biológico para cuidar las articulaciones.<br>
              <small style="color: #94a3b8;">(Riesgo: 70% éxito +1 / 30% bajón físico -1)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarRegeneracion()">Someterte al plan regenerativo</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Confiar en tus rutinas de siempre</button>
            </div>
          `;
        }
      }

      container.innerHTML = `
        <h3>💼 Despacho y Decisiones de Futuro</h3>
        <p><strong>Situación:</strong> ${player.nombre} (#${player.dorsal}) | <strong>Edad:</strong> ${player.edad} años | <strong>Club:</strong> ${player.club} | <strong>Media:</strong> ${player.media}</p>
        <p>Tu agente te presenta las opciones antes de saltar a disputar la siguiente etapa:</p>
        <hr>
        ${htmlOpciones}
      `;
    }

    function ejecutarDecision(opts) {
      if (opts.club) player.club = opts.club;
      if (opts.mediaDelta) aplicarDeltaMedia(opts.mediaDelta);
      player.edad += 2;
      player.numeroFicha += 1;
      simularFicha();
    }

    function ejecutarPresionJoven() {
      const delta = (randomInt(1, 100) <= 75) ? pickRandom([1, 2]) : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarPresionPrime() {
      const delta = (randomInt(1, 100) <= 65) ? 1 : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarPresionVeterano() {
      const delta = (randomInt(1, 100) <= 40) ? 1 : -2;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarDieta() {
      const delta = (randomInt(1, 100) <= 70) ? 1 : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarMentor() {
      const delta = (randomInt(1, 100) <= 75) ? 1 : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarRegeneracion() {
      const delta = (randomInt(1, 100) <= 70) ? 1 : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function renderFin() {
      const totTitulos = player.titulosClub + player.titulosSeleccion;
      const esAtacante = (player.posicion.includes("Delantero") || player.posicion.includes("Extremo") || player.posicion.includes("Mediapunta"));
      const tInfo = obtenerTierPais(player.nacionalidad);

      let veredicto = "";
      if (player.balonesDeOro >= 2) {
        veredicto = "🐐 <strong>EL MAYOR DE TODOS LOS TIEMPOS (G.O.A.T.):</strong> Múltiples Balones de Oro te colocan en el Olimpo absoluto del fútbol junto a los más grandes de la historia.";
      } else if (player.balonesDeOro === 1 || player.botasDeOro >= 2 || player.guantesDeOro >= 1 || player.pichichisMundial >= 1) {
        veredicto = "👑 <strong>ESTRELLA GENERACIONAL:</strong> Alcanzaste la cima del planeta y fuiste el líder absoluto de tu época dorada.";
      } else if (totTitulos >= 6) {
        veredicto = "⭐ <strong>COLECCIONISTA DE COPAS:</strong> Un ganador nato que llenó las vitrinas de los clubes por donde pasó.";
      } else {
        veredicto = "⚽ <strong>CARRERA PROFESIONAL DE ÉLITE:</strong> Competiste con honor al máximo nivel internacional durante dos décadas completas.";
      }

      container.innerHTML = `
        <h1>🏆 Fin de la Carrera Profesional: ${player.nombre}</h1>
        <p>A los <strong>${player.edad} años</strong>, cuelgas las botas definitivamente. Así queda el legado de tu carrera tras disputar tus 11 etapas oficiales:</p>

        <div style="background: #1e293b; padding: 20px; border-radius: 8px; margin: 20px 0; line-height: 1.8;">
          <p>• <strong>Nombre:</strong> ${player.nombre} (#${player.dorsal})</p>
          <p>• <strong>Nacionalidad:</strong> ${player.nacionalidad} <span class="tag-tier">${tInfo.nombre}</span></p>
          <p>• <strong>Posición:</strong> ${player.posicion} | <strong>Pierna:</strong> ${player.pieHabil}</p>
          <p>• <strong>Media final de retirada:</strong> ${player.media} / 99</p>
          <p>• <strong>Partidos oficiales en clubes:</strong> ${player.partidosTotales} | <strong>Goles:</strong> ${player.golesTotales}</p>
          ${(player.posicion === "Portero" || player.posicion.includes("Defensa")) ? `<p>• <strong>Porterías a cero acumuladas:</strong> ${player.porteriasCeroTotales}</p>` : ''}
          <p>• <strong>Internacional con ${player.nacionalidad}:</strong> ${player.partidosSeleccion} partidos (${player.golesSeleccion} goles)</p>
          <p>• <strong>Total de Títulos Colectivos:</strong> ${totTitulos} (Club: ${player.titulosClub} | Selección: ${player.titulosSeleccion})</p>
          <p>• <strong>Distinciones individuales:</strong> 🟡 ${player.balonesDeOro} Balones de Oro | 👟 ${player.botasDeOro} Botas de Oro | 🧤 ${player.guantesDeOro} Guantes de Oro | ⭐ ${player.vecesOnceIdeal} Once Ideal FIFPRO</p>
          ${esAtacante ? `<p>• <strong>Trofeos de Máximo Goleador:</strong> ⚽ ${player.pichichisLiga} Pichichis de Liga | ⚽ ${player.pichichisChampions} Goleador de Champions \vert{} ⚽${player.pichichisMundial} Botas de Oro en Mundiales</p>` : ''}
        </div>

        <h3>🏅 Vitrina de Títulos Colectivos:</h3>
        <div style="margin: 10px 0;">
          ${player.listaTitulos.length ? player.listaTitulos.map(t => `<p>• ${t}${tagTierTitulo(t)}</p>`).join('') : '<p><em>No lograste levantar ningún título colectivo en tu carrera.</em></p>'}
        </div>

        <hr>
        <h3>🎖️ Historial de Galardones Individuales:</h3>
        <div style="margin: 10px 0;">
          ${player.listaPremiosIndiv.length ? player.listaPremiosIndiv.map(pr => `<p>• ${pr}</p>`).join('') : '<p><em>No lograste cosechar premios individuales de máxima categoría.</em></p>'}
        </div>

        <hr>
        <h3>Veredicto Histórico:</h3>
        <p style="font-size: 1.05rem; margin: 12px 0;">${veredicto}</p>

        <button class="btn-primario" onclick="location.reload()">Jugar una nueva carrera desde cero</button>
      `;
    }

    // Iniciar juego
    renderStart();
  </script>
</body>
</html>
