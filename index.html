<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fichas: Carrera de Fútbol</title>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --gold: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    #game-container {
      width: 100%;
      max-width: 760px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1, h2, h3 { color: #ffffff; margin-bottom: 14px; font-weight: 800; }
    h1 { font-size: 1.8rem; text-align: center; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.15rem; color: var(--accent); }

    p { line-height: 1.6; margin-bottom: 12px; color: var(--text-main); }
    hr { border: 0; border-top: 1px solid var(--border-color); margin: 20px 0; }

    .tarjeta-ficha {
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .ficha-juvenil {
      background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
      border: 1px solid #38bdf8;
    }

    .ficha-prime {
      background: linear-gradient(135deg, #14532d 0%, #16a34a 100%);
      border: 1px solid #4ade80;
    }

    .ficha-veterano {
      background: linear-gradient(135deg, #78350f 0%, #d97706 100%);
      border: 1px solid #fbbf24;
    }

    .badge-etapa {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .finanzas-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 8px;
      font-size: 0.88rem;
    }

    .progreso-carrera {
      display: flex;
      gap: 3px;
      margin-top: 10px;
    }

    .progreso-bloque {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .progreso-bloque.activo {
      background: #ffffff;
    }

    .cartel {
      border-radius: 8px;
      padding: 14px 18px;
      margin: 15px 0;
      border-left: 6px solid;
    }

    .cartel-titular {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .cartel-cuerpo {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .cartel-stats {
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: 6px;
      line-height: 1.6;
    }

    .cartel-oro {
      background: rgba(234, 179, 8, 0.15);
      border-color: #eab308;
      color: #fef08a;
    }

    .cartel-verde {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      color: #bbf7d0;
    }

    .cartel-azul {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #bfdbfe;
    }

    .cartel-rojo {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fecaca;
    }

    .cartel-moral {
      background: rgba(168, 85, 247, 0.15);
      border-left: 5px solid #a855f7;
      color: #e9d5ff;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 0;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .cartel-fisico {
      background: rgba(14, 165, 233, 0.15);
      border-left: 5px solid #0ea5e9;
      color: #bae6fd;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 0;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .cartel-mercado {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.2) 0%, rgba(180, 83, 9, 0.3) 100%);
      border-left: 5px solid #f59e0b;
      color: #fef08a;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 14px 0;
      line-height: 1.5;
    }

    .cartel-retiro {
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.25) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #ef4444;
      color: #fecaca;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .cartel-clinica {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #06b6d4;
      color: #cffafe;
      border-radius: 8px;

    }

    .cartel-drama {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #ec4899;
      color: #fbcfe8;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .cartel-tactica {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #10b981;
      color: #a7f3d0;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .cartel-forzado {
      background: linear-gradient(135deg, rgba(185, 28, 28, 0.3) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #dc2626;
      color: #fca5a5;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .cartel-mister {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #d97706;
      color: #fde68a;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .cartel-noticia {
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      border: 2px solid #e11d48;
      border-radius: 10px;
      padding: 16px 18px;
      margin: 15px 0;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.2);
    }

    .badge-prensa {
      display: inline-block;
      background: #e11d48;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 2px 7px;
      border-radius: 3px;
      margin-bottom: 8px;
    }

    .oferta-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .oferta-header {
      font-weight: 800;
      font-size: 1.05rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    .oferta-detalles {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .lista-opciones {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
    }

    button.btn-opcion {
      background-color: #1e3a8a;
      color: #ffffff;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.btn-opcion:hover {
      background-color: #2563eb;
      transform: translateY(-1px);
    }

    button.btn-opcion-retiro {
      background-color: #7f1d1d;
      border-color: #ef4444;
      color: #fecaca;
    }

    button.btn-opcion-retiro:hover {
      background-color: #991b1b;
    }

    button.btn-primario {
      background-color: #0284c7;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
    }

    button.btn-primario:hover {
      background-color: #0369a1;
    }

    button.btn-compartir {
      background-color: #16a34a;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
      transition: background-color 0.2s;
    }

    button.btn-compartir:hover {
      background-color: #15803d;
    }

    input[type="text"] {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      margin: 6px 0 16px 0;
    }

    .vitrina-box {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #eab308;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
    }

    .seleccion-box {
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid #3b82f6;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
    }

    .resurreccion-box {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      border: 2px solid #818cf8;
      border-radius: 8px;
      padding: 16px;
      margin: 15px 0;
    }

    .premios-box {
      background: linear-gradient(135deg, #451a03 0%, #78350f 100%);
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 14px;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    const tier1 = ["España", "Francia", "Alemania", "Inglaterra", "Italia", "Argentina", "Brasil"];
    const tier2 = ["Portugal", "Países Bajos", "Uruguay", "Croacia", "Bélgica", "Colombia"];
    const tier3 = ["Marruecos", "Senegal", "México", "Estados Unidos", "Japón", "Chile", "Ecuador", "Polonia", "Turquía"];
    const tier4 = ["Nigeria", "Costa de Marfil", "Camerún", "Egipto", "Ghana", "Grecia", "Noruega", "Corea del Sur", "Australia", "Paraguay", "Perú"];
    const tier5 = ["Islandia", "Bolivia", "Venezuela", "Costa Rica", "Jamaica", "Honduras", "Panamá", "Argelia", "Mali", "Irán", "Catar", "Nueva Zelanda"];

    const paisesMundo = [...tier1, ...tier2, ...tier3, ...tier4, ...tier5];

    function obtenerTierPais(pais) {
      if (tier1.includes(pais)) return { tier: 1, minMediaSel: 73, probCont: 52, probMun: 38, probRes: 30, reqCont: 76, reqMun: 80 };
      if (tier2.includes(pais)) return { tier: 2, minMediaSel: 73, probCont: 38, probMun: 24, probRes: 20, reqCont: 78, reqMun: 82 };
      if (tier3.includes(pais)) return { tier: 3, minMediaSel: 72, probCont: 24, probMun: 12, probRes: 12, reqCont: 80, reqMun: 84 };
      if (tier4.includes(pais)) return { tier: 4, minMediaSel: 70, probCont: 14, probMun: 6, probRes: 6, reqCont: 82, reqMun: 86 };
      return { tier: 5, minMediaSel: 68, probCont: 8, probMun: 3, probRes: 3, reqCont: 84, reqMun: 88 };
    }

    const listaPosiciones = [
      "Delantero Centro", "Extremo Izquierdo", "Extremo Derecho",
      "Mediapunta", "Centrocampista", "Pivote Defensivo",
      "Lateral Izquierdo", "Lateral Derecho", "Defensa Central", "Portero"
    ];

    const listaCanteras = [
      "Real Madrid (La Fábrica)", "FC Barcelona (La Masia)", "Atlético de Madrid", 
      "Athletic Club (Lezama)", "Real Sociedad (Zubieta)", "Valencia CF (Paterna)",
      "Manchester City", "Chelsea FC (Cobham)", "Arsenal FC (Hale End)", "Manchester United",
      "Bayern Múnich", "Borussia Dortmund", "Bayer Leverkusen",
      "Paris Saint-Germain", "Olympique de Lyon", "AS Mónaco",
      "Ajax de Ámsterdam", "PSV Eindhoven", "Feyenoord",
      "SL Benfica (Seixal)", "Sporting de Portugal (Alcochete)", "FC Porto",
      "Juventus", "AC Milan", "Inter de Milán", "Atalanta",
      "River Plate", "Boca Juniors", "Santos FC", "Flamengo"
    ];

    const clubesEuropaTop = [
      "Real Madrid", "FC Barcelona", "Manchester City", "Liverpool FC", 
      "Arsenal FC", "Bayern Múnich", "Paris Saint-Germain", "Inter de Milán", 
      "Juventus", "Atlético de Madrid", "Borussia Dortmund"
    ];

    const clubesEuropaMedios = [
      "Bayer Leverkusen", "Chelsea FC", "Atalanta", "Manchester United", 
      "Tottenham Hotspur", "Aston Villa", "Newcastle United", "AC Milan", 
      "AS Roma", "SSC Napoli", "Sevilla FC", "Real Sociedad", "Athletic Club", 
      "SL Benfica", "Sporting de Portugal", "FC Porto", "Ajax de Ámsterdam"
    ];

    const clubesEuropaBajos = [
      "Valencia CF", "Real Betis", "Villarreal CF", "Girona FC", "Celta de Vigo",
      "West Ham United", "Brighton", "Everton FC", "Wolverhampton",
      "Eintracht Frankfurt", "VfB Stuttgart", "RB Leipzig", "Fiorentina", 
      "Lazio", "LOSC Lille", "AS Mónaco", "Feyenoord"
    ];

    const clubesExoticos = ["Al-Hilal", "Al-Nassr", "Inter Miami", "LA Galaxy", "Vissel Kobe"];

    let player = {
      nombre: "Álex Navarro",
      dorsal: 10,
      nacionalidad: "",
      posicion: "",
      pieHabil: "",
      club: "",
      edad: 17,
      numeroFicha: 1,
      totalFichas: 11,
      modoJuego: 11,
      retiradoSeleccion: false,
      retiradoFutbol: false,
      seHaOperado: false,
      haDesobedecido: false,
      haExigidoDinero: false,
      motivoRetirada: "",
      media: 67,
      valorMercado: 2.5,
      valorMercadoRecord: 2.5,
      sueldoAnual: 0.5,
      aniosContratoRestantes: 3,
      clausulaRescision: 20,
      titulosClub: 0,
      titulosSeleccion: 0,
      mundialesGanados: 0,
      continentalesGanados: 0,
      listaTitulos: [],
      partidosTotales: 0,
      golesTotales: 0,
      asistenciasTotales: 0,
      partidosSeleccion: 0,
      golesSeleccion: 0,
      asistenciasSeleccion: 0,
      porteriasCeroTotales: 0,
      pasesCompletadosTotales: 0,
      pasesClaveTotales: 0,
      regatesTotales: 0,
      recuperacionesTotales: 0,
      paradasTotales: 0,
      balonesDeOro: 0,
      botasDeOro: 0,
      guantesDeOro: 0,
      vecesOnceIdeal: 0,
      pichichisLiga: 0,
      pichichisChampions: 0,
      pichichisMundial: 0,
      listaPremiosIndiv: [],
      ultimoEstadoMental: 0,
      ultimoEstadoFisico: 0
    };

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function pickDistinct(arr, count, exclude = []) {
      const copy = arr.filter(x => !exclude.includes(x));
      const res = [];
      for (let i = 0; i < count; i++) {
        if (!copy.length) break;
        const idx = Math.floor(Math.random() * copy.length);
        res.push(copy.splice(idx, 1)[0]);
      }
      return res;
    }

    function pickRandomExcept(arr, exclude) {
      const filtered = arr.filter(c => c !== exclude);
      return filtered[Math.floor(Math.random() * filtered.length)];
    }

    function calcularFactorDificultadSeleccion(vecesGanado) {
      if (vecesGanado === 0) return 1.0;
      if (vecesGanado === 1) return 0.33;
      return 0.10;
    }

    function obtenerPosicionReconversion(posActual) {
      const mapaEstricto = {
        "Defensa Central": ["Pivote Defensivo", "Lateral Derecho", "Lateral Izquierdo"],
        "Lateral Izquierdo": ["Extremo Izquierdo", "Defensa Central"],
        "Lateral Derecho": ["Extremo Derecho", "Defensa Central"],
        "Pivote Defensivo": ["Defensa Central", "Centrocampista"],
        "Centrocampista": ["Mediapunta", "Pivote Defensivo"],
        "Mediapunta": ["Centrocampista", "Extremo Izquierdo", "Extremo Derecho", "Delantero Centro"],
        "Extremo Izquierdo": ["Delantero Centro", "Mediapunta", "Lateral Izquierdo"],
        "Extremo Derecho": ["Delantero Centro", "Mediapunta", "Lateral Derecho"],
        "Delantero Centro": ["Mediapunta", "Extremo Izquierdo", "Extremo Derecho"]
      };
      const opciones = mapaEstricto[posActual];
      if (!opciones || !opciones.length) return null;
      return pickRandom(opciones);
    }

    function calcularValorMercado() {
      const m = player.media;
      const e = player.edad;
      let base = 0;

      if (m < 70) base = 1 + (m - 60) * 0.4;
      else if (m < 75) base = 5 + (m - 70) * 2;
      else if (m < 80) base = 15 + (m - 75) * 4;
      else if (m < 85) base = 35 + (m - 80) * 8;
      else if (m < 90) base = 75 + (m - 85) * 15;
      else base = 150 + (m - 90) * 25;

      let factorEdad = 1.0;
      if (e <= 21) factorEdad = 1.6;
      else if (e <= 24) factorEdad = 1.4;
      else if (e <= 28) factorEdad = 1.15;
      else if (e <= 30) factorEdad = 0.9;
      else if (e <= 33) factorEdad = 0.55;
      else if (e <= 35) factorEdad = 0.3;
      else factorEdad = 0.12;

      let factorPos = 1.0;
      if (player.posicion.includes("Delantero") || player.posicion.includes("Extremo")) factorPos = 1.15;
      else if (player.posicion === "Portero") factorPos = 0.8;

      let val = Math.max(0.5, Math.round(base * factorEdad * factorPos * 10) / 10);
      player.valorMercado = val;
      if (val > player.valorMercadoRecord) {
        player.valorMercadoRecord = val;
      }

      let factorClub = clubesEuropaTop.includes(player.club) ? 1.3 : (clubesEuropaMedios.includes(player.club) ? 1.0 : 0.7);
      if (clubesExoticos.includes(player.club)) factorClub = 2.4;
      player.sueldoAnual = Math.max(0.3, Math.round((val * 0.11 * factorClub) * 10) / 10);
      player.clausulaRescision = Math.round(val * 1.5);
    }

    // Progresión más difícil a partir de los 30 años
    function aplicarDeltaMedia(delta) {
      if (delta > 0) {
        if (player.edad >= 33) {
          delta = (randomInt(1, 100) <= 25) ? 1 : 0;
        } else if (player.edad >= 30) {
          delta = (delta >= 2) ? 1 : ((randomInt(1, 100) <= 50) ? 1 : 0);
        } else if (player.media >= 88) {
          delta = (delta >= 2) ? 1 : 0;
        } else if (player.media >= 83 && delta >= 3) {
          delta = 2;
        }
      }
      player.media = Math.min(99, Math.max(40, player.media + delta));
      calcularValorMercado();
    }

    function generarDetalleContrato(clubDestino) {
      const esTop = clubesEuropaTop.includes(clubDestino);
      const esExotico = clubesExoticos.includes(clubDestino);
      const duracion = player.edad >= 33 ? randomInt(1, 2) : randomInt(3, 5);
      const multiplicador = esExotico ? 2.5 : (esTop ? 1.4 : 0.9);
      const sueldoPropuesto = Math.max(0.8, Math.round((player.sueldoAnual * multiplicador) * 10) / 10);
      const primaFichaje = Math.round(sueldoPropuesto * 0.4 * 10) / 10;
      const clausula = Math.round(player.valorMercado * 1.6);
      const rol = player.media >= 84 ? "Estrella indiscutible" : (player.media >= 78 ? "Titular clave" : "Rotación de plantilla");

      return {
        club: clubDestino,
        duracion: duracion,
        sueldo: sueldoPropuesto,
        prima: primaFichaje,
        clausula: clausula,
        rol: rol
      };
    }

    const container = document.getElementById("game-container");

    function renderStart() {
      container.innerHTML = `
        <h1>⚽ FICHAS: CARRERA DE FÚTBOL</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">De Promesa Juvenil a Leyenda del Deporte Rey</p>
        <p>Vive una trayectoria profesional completa con tácticas de club y selección enfrentadas, contratos detallados, curva de edad realista y calendario internacional riguroso.</p>
        <hr>
        <h3>Selecciona el Modo de Juego:</h3>
        <div class="lista-opciones">
          <button class="btn-opcion" onclick="elegirModo(11)">
            ⚡ <strong>Modo Clásico (11 Fichas)</strong><br>
            <small style="color: #94a3b8;">Etapas bianuales (cada ficha avanza 2 años). Permite bicampeonatos por ficha.</small>
          </button>
          <button class="btn-opcion" onclick="elegirModo(22)">
            📖 <strong>Modo Inmersivo (22 Fichas)</strong><br>
            <small style="color: #94a3b8;">Temporada a temporada (cada ficha avanza 1 año). Experiencia paso a paso y progresión anual.</small>
          </button>
        </div>
      `;
    }

    function elegirModo(m) {
      player.modoJuego = m;

              🌟 <strong>CAPITÁN Y MENTOR DE LA CANTERA (${player.edad} años)</strong><br>

              <small style="color: #94a3b8;">(Riesgo: 75% éxito de liderazgo +1 / 25% fricción y perder -1)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarMentor()">Aceptar ser su mentor (Transmitir tus galones)</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Rechazarlo: en el fútbol profesional cada uno debe ganarse su puesto</button>
            </div>
          `;
        } else if (azarVet === 2) {
          htmlOpciones = `
            <div style="background: rgba(239, 68, 68, 0.15); border-left: 4px solid #ef4444; padding: 14px; margin: 15px 0;">
              🛑 <strong>EL DESGASTE DE LOS AÑOS: ¿DEFENDER A TUS ${player.edad} AÑOS?</strong><br>
              El míster pide presión alta constante. A tu edad, forzar sprints castiga rodillas e isquios.<br>
              <small style="color: #94a3b8;">(Veteranía: 40% admiración +1 / 60% rotura muscular y perder -2 de media)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarPresionVeterano()">Forzar la máquina y presionar como un canterano más</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Dosificar inteligentemente y jugar con la cabeza</button>
            </div>
          `;
        } else if (azarVet === 3) {
          const exotico = pickRandom(clubesExoticos);
          const modesto = pickRandomExcept(clubesEuropaBajos, player.club);
          const detEx = generarDetalleContrato(exotico);
          const detMod = generarDetalleContrato(modesto);

          htmlOpciones = `
            <div style="background: rgba(148, 163, 184, 0.15); border-left: 4px solid #94a3b8; padding: 14px; margin: 15px 0;">
              ⌛ <strong>RECTA FINAL DE CARRERA: OFERTAS DE VETERANÍA</strong>
            </div>
            <div class="oferta-card">
              <div class="oferta-header">🌴 Retiro Dorado en ${detEx.club}</div>
              <div class="oferta-detalles">
                • <strong>Duración:</strong> ${detEx.duracion} temporadas<br>
                • <strong>Sueldo estratosférico:</strong> €${detEx.sueldo}M/año | <strong>Prima:</strong> €${detEx.prima}M<br>
                • <strong>Rol:</strong> Franquicia internacional
              </div>
              <button class="btn-opcion" onclick="ejecutarDecision({club: '${detEx.club}'})">Fichar por el <strong>${detEx.club}</strong></button>
            </div>
            <div class="oferta-card">
              <div class="oferta-header">🛡️ Jerarquía en ${detMod.club}</div>
              <div class="oferta-detalles">
                • <strong>Duración:</strong> ${detMod.duracion} temporadas<br>
                • <strong>Sueldo:</strong> €${detMod.sueldo}M/año<br>
                • <strong>Rol:</strong> Líder de vestuario
              </div>
              <button class="btn-opcion" onclick="ejecutarDecision({club: '${detMod.club}'})">Fichar por el <strong>${detMod.club}</strong></button>
            </div>
            <button class="btn-opcion" onclick="ejecutarDecision({})">Pelear por tu puesto y quedarte en el <strong>${player.club}</strong></button>
          `;
        } else {
          htmlOpciones = `
            <div style="background: rgba(16, 185, 129, 0.15); border-left: 4px solid #10b981; padding: 14px; margin: 15px 0;">
              🥗 <strong>PLAN DE REGENERACIÓN FÍSICA PARA VETERANOS</strong><br>
              A tus ${player.edad} años, te ofrecen un protocolo biológico para cuidar las articulaciones.<br>
              <small style="color: #94a3b8;">(Riesgo: 70% éxito +1 / 30% bajón físico -1)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarRegeneracion()">Someterte al plan regenerativo</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Confiar en tus rutinas de siempre</button>
            </div>
          `;
        }
      }

      container.innerHTML = `
        <h3>💼 Despacho y Decisiones de Futuro</h3>
        <p><strong>Situación:</strong> ${player.nombre} (#${player.dorsal}) | <strong>Edad:</strong> ${player.edad} años | <strong>Posición:</strong> ${player.posicion} | <strong>Club actual:</strong> <strong>${player.club}</strong> | <strong>Media:</strong> ${player.media}</p>
        <div style="background: rgba(0, 0, 0, 0.3); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 0.9rem;">
          🏷️ <strong>Valoración de Mercado:</strong> €${player.valorMercado}M | 💵 <strong>Sueldo:</strong> €${player.sueldoAnual}M/año | 🏆 <strong>Valor Récord:</strong> €${player.valorMercadoRecord}M
        </div>
        <p>Tu agente te presenta las opciones antes de saltar a disputar la siguiente etapa:</p>
        <hr>
        ${htmlTratamientoMedico}
        ${htmlOpcionRetiroFutbol}
        ${htmlRetiroSeleccion}
        ${htmlOpciones}
      `;
    }

    function resolverConflictoTáctico(eleccion) {
      if (eleccion === 'club') {
        aplicarDeltaMedia(1);
        player.ultimoEstadoMental = 1;
        alert(`Te comprometes con la pizarra de ${player.club}: el entrenador te elogia públicamente y ganas +1 de media, aunque el seleccionador te avisa de que tu rol internacional se resentirá.`);
      } else if (eleccion === 'sel') {
        aplicarDeltaMedia(1);
        player.ultimoEstadoMental = 1;
        alert(`Priorizas tu liderazgo con ${player.nacionalidad}: brillas en el parón internacional (+1 de media), pero el míster de tu club te recrimina falta de sincronía táctica.`);
      } else {
        aplicarDeltaMedia(-1);
        player.ultimoEstadoMental = -1;
        alert(`Decides jugar a tu aire sin obedecer a nadie: ambos entrenadores se enfurecen por tu indisciplina táctica y pierdes -1 de media.`);
      }
      renderDespacho();
    }

    function resolverDilemaEntrenador(deltaMedia, msg, desobedecio) {
      if (deltaMedia !== 0) aplicarDeltaMedia(deltaMedia);
      if (desobedecio) player.haDesobedecido = true;
      alert(msg);
      renderDespacho();
    }

    function ejecutarCambioPosicion(nuevaPos, acepto) {
      if (acepto) {
        player.posicion = nuevaPos;
        const exito = (randomInt(1, 100) <= 65);
        if (exito) {
          aplicarDeltaMedia(1);
          player.ultimoEstadoMental = 1;
          alert(`¡RECONVERSIÓN EXITOSA! Te adaptas a la perfección a tu nueva demarcación de ${nuevaPos}: ganas +1 de media.`);
        } else {
          aplicarDeltaMedia(-1);
          player.ultimoEstadoMental = -1;
          alert(`DIFICULTADES DE ADAPTACIÓN. Tu rendimiento se resiente jugando de ${nuevaPos}: pierdes -1 de media.`);
        }
      } else {
        const conflicto = (randomInt(1, 100) <= 30);
        if (conflicto) {
          aplicarDeltaMedia(-1);
          player.ultimoEstadoMental = -1;
          alert(`TENSIÓN TÁCTICA. Tu negativa a cambiar de rol incomoda al míster: pierdes -1 de media.`);
        } else {
          alert(`POSTURA RESPETADA. Continúas defendiendo tu rol natural de ${player.posicion}.`);
        }
      }
      renderDespacho();
    }

    function ejecutarTratamientoMedico() {
      player.seHaOperado = true;
      const exito = (randomInt(1, 100) <= 60);
      if (exito) {
        aplicarDeltaMedia(2);
        player.ultimoEstadoFisico = 1;
        player.ultimoEstadoMental = 1;
        alert("¡ÉXITO MÉDICO TOTAL! La intervención de vanguardia ha sido un triunfo: regeneras tus tejidos y ganas +2 de media.");
      } else {
        aplicarDeltaMedia(-2);
        player.ultimoEstadoFisico = -1;
        alert("COMPLICACIÓN QUIRÚRGICA. Surgen secuelas musculares inesperadas: pierdes -2 de media.");
      }
      renderDespacho();
    }

    function forzarRetirada(motivo) {
      player.retiradoFutbol = true;
      player.motivoRetirada = motivo;
      renderFin();
    }

    function retirarseDeSeleccion() {
      player.retiradoSeleccion = true;
      aplicarDeltaMedia(1);
      alert(`Has anunciado oficialmente tu retirada de la Selección de ${player.nacionalidad}. A partir de ahora te enfocarás 100% en ${player.club}.`);
      renderDespacho();
    }

    function ejecutarDecision(opts) {
      if (opts.club) player.club = opts.club;
      if (opts.mediaDelta) aplicarDeltaMedia(opts.mediaDelta);
      player.edad += (player.modoJuego === 22) ? 1 : 2;
      player.numeroFicha += 1;
      calcularValorMercado();

      if (player.edad >= 40) {
        forzarRetirada("Límite absoluto alcanzado: Cuelgas las botas a los 40 años como una leyenda viviente del fútbol.");
      } else {
        simularFicha();
      }
    }

    function ejecutarPresionJoven() {
      const delta = (randomInt(1, 100) <= 75) ? pickRandom([1, 2]) : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarPresionPrime() {
      const delta = (randomInt(1, 100) <= 65) ? 1 : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarPresionVeterano() {
      const delta = (randomInt(1, 100) <= 40) ? 1 : -2;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarDieta() {
      const delta = (randomInt(1, 100) <= 70) ? 1 : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarMentor() {
      const delta = (randomInt(1, 100) <= 75) ? 1 : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarRegeneracion() {
      const delta = (randomInt(1, 100) <= 70) ? 1 : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function copiarResumen(veredictoLimpio) {
      const totTitulos = player.titulosClub + player.titulosSeleccion;
      const texto = `⚽ HISTORIAL DE CARRERA: ${player.nombre} (#${player.dorsal})
🌍 Nacionalidad: ${player.nacionalidad}
🏃 Posición: ${player.posicion} (${player.pieHabil})
📊 Media de retirada: ${player.media} | Edad de retirada: ${player.edad} años
🏷️ Valor Récord Histórico: €${player.valorMercadoRecord}M
👕 Partidos de club: ${player.partidosTotales} (⚽ ${player.golesTotales}G | 🅰️ ${player.asistenciasTotales}A)
🔵 Internacional: ${player.partidosSeleccion} partidos (${player.golesSeleccion}G | 🅰️ ${player.asistenciasSeleccion}A)
🏆 Títulos Colectivos: ${totTitulos} (Club: ${player.titulosClub} | Selección: ${player.titulosSeleccion} [${player.mundialesGanados} Mundiales, ${player.continentalesGanados} Copas Continentales])
🟡 Balones de Oro: ${player.balonesDeOro} | 👟 Botas de Oro: ${player.botasDeOro}
🎖️ Estatus: ${veredictoLimpio}
🛑 Motivo de Retirada: ${player.motivoRetirada || 'Retiro natural al concluir tu ciclo profesional'}
🎮 Modo jugado: ${player.modoJuego === 22 ? '22 Fichas (Anual)' : '11 Fichas (Bianual)'} en Fichas: Carrera de Fútbol`;

      navigator.clipboard.writeText(texto).then(() => {
        alert("¡Resumen de carrera copiado al portapapeles! Ya puedes pegarlo y compartirlo donde quieras.");
      }).catch(() => {
        alert("No se pudo copiar automáticamente. Puedes seleccionar el texto manualmente.");
      });
    }

    function renderFin() {
      const totTitulos = player.titulosClub + player.titulosSeleccion;
      const esAtacante = (player.posicion.includes("Delantero") || player.posicion.includes("Extremo") || player.posicion.includes("Mediapunta"));
      const esDefensa = (player.posicion.includes("Defensa") || player.posicion.includes("Lateral") || player.posicion === "Pivote Defensivo");
      const esPortero = (player.posicion === "Portero");

      let veredicto = "";
      let veredictoTexto = "";
      if (player.balonesDeOro >= 2) {
        veredictoTexto = "EL MAYOR DE TODOS LOS TIEMPOS (G.O.A.T.)";
        veredicto = "🐐 <strong>EL MAYOR DE TODOS LOS TIEMPOS (G.O.A.T.):</strong> Múltiples Balones de Oro te colocan en el Olimpo absoluto del fútbol junto a los más grandes de la historia.";
      } else if (player.balonesDeOro === 1 || player.botasDeOro >= 2 || player.guantesDeOro >= 1 || player.pichichisMundial >= 1) {
        veredictoTexto = "ESTRELLA GENERACIONAL";
        veredicto = "👑 <strong>ESTRELLA GENERACIONAL:</strong> Alcanzaste la cima del planeta y fuiste el líder absoluto de tu época dorada.";
      } else if (totTitulos >= 6) {
        veredictoTexto = "COLECCIONISTA DE COPAS";
        veredicto = "⭐ <strong>COLECCIONISTA DE COPAS:</strong> Un ganador nato que llenó las vitrinas de los clubes por donde pasó.";
      } else {
        veredictoTexto = "CARRERA PROFESIONAL DE ÉLITE";
        veredicto = "⚽ <strong>CARRERA PROFESIONAL DE ÉLITE:</strong> Competiste con honor al máximo nivel internacional.";
      }

      const motivoFinal = player.motivoRetirada || `Retiro definitivo tras completar exitosamente tu trayectoria profesional a los ${player.edad} años.`;

      container.innerHTML = `
        <h1>🏆 Fin de la Carrera Profesional: ${player.nombre}</h1>
        <p>A los <strong>${player.edad} años</strong>, cuelgas las botas definitivamente tras disputar <strong>${player.numeroFicha} etapas</strong> en la élite:</p>

        <div style="background: rgba(239, 68, 68, 0.15); border-left: 4px solid #ef4444; padding: 12px 16px; border-radius: 6px; margin: 15px 0;">
          📌 <strong>Circunstancia del retiro:</strong> ${motivoFinal}
        </div>

        <div style="background: #1e293b; padding: 20px; border-radius: 8px; margin: 20px 0; line-height: 1.8;">
          <p>• <strong>Nombre:</strong> ${player.nombre} (#${player.dorsal})</p>
          <p>• <strong>Nacionalidad:</strong> ${player.nacionalidad}</p>
          <p>• <strong>Posición final:</strong> ${player.posicion} | <strong>Pierna:</strong> ${player.pieHabil}</p>
          <p>• <strong>Media final de retirada:</strong> ${player.media} / 99</p>
          <p>• <strong>Edad de despedida:</strong> ${player.edad} años</p>
          <p>• <strong>Valor de Mercado Récord en tu Prime:</strong> <span style="color: #facc15; font-weight: bold;">€${player.valorMercadoRecord}M</span></p>
          <p>• <strong>Partidos oficiales en clubes:</strong> ${player.partidosTotales}</p>
          <p>• <strong>Producción ofensiva de club:</strong> ⚽ ${player.golesTotales} goles | 🅰️ ${player.asistenciasTotales} asistencias</p>
          ${esPortero ? `<p>• <strong>Muro bajo palos:</strong> 🧤 ${player.porteriasCeroTotales} porterías a cero | 🧱 ${player.paradasTotales} paradas totales</p>` : ''}
          ${esDefensa ? `<p>• <strong>Rendimiento defensivo:</strong> 🛡️ ${player.recuperacionesTotales} recuperaciones/entradas \vert{} 🧤 ${player.porteriasCeroTotales} porterías a cero</p>` : ''}
          ${(!esPortero && !esDefensa) ? `<p>• <strong>Creación y desborde:</strong> 🔑 ${player.pasesClaveTotales} pases clave | ⚡ ${player.regatesTotales} regates \vert{} 🎯 ${player.pasesCompletadosTotales} pases completados</p>` : ''}
          <p>• <strong>Internacional con ${player.nacionalidad}:</strong> ${player.partidosSeleccion} partidos (${player.golesSeleccion} goles, ${player.asistenciasSeleccion} asistencias)${player.retiradoSeleccion ? ' <em>(Retirado de selección a los 30+ años)</em>' : ''}</p>
          <p>• <strong>Total de Títulos Colectivos:</strong> ${totTitulos} (Club: ${player.titulosClub} | Selección: ${player.titulosSeleccion} [${player.mundialesGanados} Copas del Mundo, ${player.continentalesGanados} Torneos Continentales])</p>
          <p>• <strong>Distinciones individuales:</strong> 🟡 ${player.balonesDeOro} Balones de Oro | 👟 ${player.botasDeOro} Botas de Oro | 🧤 ${player.guantesDeOro} Guantes de Oro | ⭐ ${player.vecesOnceIdeal} Once Ideal FIFPRO</p>
          ${esAtacante ? `<p>• <strong>Trofeos de Máximo Goleador:</strong> ⚽ ${player.pichichisLiga} Pichichis de Liga | ⚽ ${player.pichichisChampions} Goleador de Champions \vert{} ⚽${player.pichichisMundial} Botas de Oro en Mundiales</p>` : ''}
        </div>

        <h3>🏅 Vitrina de Títulos Colectivos:</h3>
        <div style="margin: 10px 0;">
          ${player.listaTitulos.length ? player.listaTitulos.map(t => `<p>• ${t}</p>`).join('') : '<p><em>No lograste levantar ningún título colectivo en tu carrera.</em></p>'}
        </div>

        <hr>
        <h3>🎖️ Historial de Galardones Individuales:</h3>
        <div style="margin: 10px 0;">
          ${player.listaPremiosIndiv.length ? player.listaPremiosIndiv.map(pr => `<p>• ${pr}</p>`).join('') : '<p><em>No lograste cosechar premios individuales de máxima categoría.</em></p>'}
        </div>

        <hr>
        <h3>Veredicto Histórico:</h3>
        <p style="font-size: 1.05rem; margin: 12px 0;">${veredicto}</p>

        <button class="btn-compartir" onclick="copiarResumen('${veredictoTexto}')">📋 Copiar y Compartir Resumen de Carrera</button>
        <button class="btn-primario" onclick="location.reload()">Jugar una nueva carrera desde cero</button>
      `;
    }

    renderStart();
  </script>
</body>
</html>
