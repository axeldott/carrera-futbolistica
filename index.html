<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fichas: Carrera de Fútbol</title>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --gold: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    #game-container {
      width: 100%;
      max-width: 760px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1, h2, h3 { color: #ffffff; margin-bottom: 14px; font-weight: 800; }
    h1 { font-size: 1.8rem; text-align: center; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.15rem; color: var(--accent); }

    p { line-height: 1.6; margin-bottom: 12px; color: var(--text-main); }
    hr { border: 0; border-top: 1px solid var(--border-color); margin: 20px 0; }

    .tarjeta-ficha {
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .ficha-juvenil {
      background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
      border: 1px solid #38bdf8;
    }

    .ficha-prime {
      background: linear-gradient(135deg, #14532d 0%, #16a34a 100%);
      border: 1px solid #4ade80;
    }

    .ficha-veterano {
      background: linear-gradient(135deg, #78350f 0%, #d97706 100%);
      border: 1px solid #fbbf24;
    }

    .badge-etapa {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .finanzas-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 8px;
      font-size: 0.88rem;
    }

    .progreso-carrera {
      display: flex;
      gap: 3px;
      margin-top: 10px;
    }

    .progreso-bloque {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .progreso-bloque.activo {
      background: #ffffff;
    }

    .cartel {
      border-radius: 8px;
      padding: 14px 18px;
      margin: 15px 0;
      border-left: 6px solid;
    }

    .cartel-titular {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .cartel-cuerpo {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .cartel-stats {
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: 6px;
      line-height: 1.6;
    }

    .cartel-oro {
      background: rgba(234, 179, 8, 0.15);
      border-color: #eab308;
      color: #fef08a;
    }

    .cartel-verde {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      color: #bbf7d0;
    }

    .cartel-azul {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #bfdbfe;
    }

    .cartel-rojo {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fecaca;
    }

    .cartel-moral {
      background: rgba(168, 85, 247, 0.15);
      border-left: 5px solid #a855f7;
      color: #e9d5ff;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 0;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .cartel-fisico {
      background: rgba(14, 165, 233, 0.15);
      border-left: 5px solid #0ea5e9;
      color: #bae6fd;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 10px 0;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .cartel-mercado {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.2) 0%, rgba(180, 83, 9, 0.3) 100%);
      border-left: 5px solid #f59e0b;
      color: #fef08a;
      border-radius: 8px;

    .cartel-retiro {

      border-left: 5px solid #ef4444;
      color: #fecaca;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .cartel-clinica {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #06b6d4;
      color: #cffafe;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .cartel-drama {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #ec4899;
      color: #fbcfe8;

      padding: 14px 16px;
      margin: 15px 0;

    .cartel-tactica {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #10b981;
      color: #a7f3d0;

      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;

    .cartel-forzado {
      background: linear-gradient(135deg, rgba(185, 28, 28, 0.3) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #dc2626;
      color: #fca5a5;

      padding: 14px 16px;
      margin: 15px 0;

    }

    .cartel-mister {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 5px solid #d97706;
      color: #fde68a;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 15px 0;
      line-height: 1.5;
    }

    .cartel-noticia {

      border: 2px solid #e11d48;
      border-radius: 10px;
      padding: 16px 18px;
      margin: 15px 0;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.2);
    }

    .badge-prensa {
      display: inline-block;
      background: #e11d48;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 2px 7px;
      border-radius: 3px;
      margin-bottom: 8px;
    }

    .lista-opciones {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
    }

    button.btn-opcion {
      background-color: #1e3a8a;
      color: #ffffff;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.btn-opcion:hover {
      background-color: #2563eb;
      transform: translateY(-1px);
    }

    button.btn-opcion-retiro {
      background-color: #7f1d1d;
      border-color: #ef4444;
      color: #fecaca;
    }

    button.btn-opcion-retiro:hover {
      background-color: #991b1b;
    }

    button.btn-primario {
      background-color: #0284c7;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
    }

    button.btn-primario:hover {
      background-color: #0369a1;
    }

    button.btn-compartir {
      background-color: #16a34a;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
      transition: background-color 0.2s;
    }

    button.btn-compartir:hover {
      background-color: #15803d;
    }

    input[type="text"] {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      margin: 6px 0 16px 0;
    }

    .vitrina-box {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #eab308;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
    }

    .seleccion-box {
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid #3b82f6;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
    }

    .resurreccion-box {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      border: 2px solid #818cf8;
      border-radius: 8px;
      padding: 16px;
      margin: 15px 0;
    }

    .premios-box {
      background: linear-gradient(135deg, #451a03 0%, #78350f 100%);
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 14px;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    const tier1 = ["España", "Francia", "Alemania", "Inglaterra", "Italia", "Argentina", "Brasil"];
    const tier2 = ["Portugal", "Países Bajos", "Uruguay", "Croacia", "Bélgica", "Colombia"];
    const tier3 = ["Marruecos", "Senegal", "México", "Estados Unidos", "Japón", "Chile", "Ecuador", "Polonia", "Turquía"];
    const tier4 = ["Nigeria", "Costa de Marfil", "Camerún", "Egipto", "Ghana", "Grecia", "Noruega", "Corea del Sur", "Australia", "Paraguay", "Perú"];
    const tier5 = ["Islandia", "Bolivia", "Venezuela", "Costa Rica", "Jamaica", "Honduras", "Panamá", "Argelia", "Mali", "Irán", "Catar", "Nueva Zelanda"];

    const paisesMundo = [...tier1, ...tier2, ...tier3, ...tier4, ...tier5];

    function obtenerTierPais(pais) {
      if (tier1.includes(pais)) return { tier: 1, minMediaSel: 73, probCont: 52, probMun: 38, probRes: 30, reqCont: 76, reqMun: 80 };
      if (tier2.includes(pais)) return { tier: 2, minMediaSel: 73, probCont: 38, probMun: 24, probRes: 20, reqCont: 78, reqMun: 82 };
      if (tier3.includes(pais)) return { tier: 3, minMediaSel: 72, probCont: 24, probMun: 12, probRes: 12, reqCont: 80, reqMun: 84 };
      if (tier4.includes(pais)) return { tier: 4, minMediaSel: 70, probCont: 14, probMun: 6, probRes: 6, reqCont: 82, reqMun: 86 };
      return { tier: 5, minMediaSel: 68, probCont: 8, probMun: 3, probRes: 3, reqCont: 84, reqMun: 88 };
    }

    const listaPosiciones = [
      "Delantero Centro", "Extremo Izquierdo", "Extremo Derecho",
      "Mediapunta", "Centrocampista", "Pivote Defensivo",
      "Lateral Izquierdo", "Lateral Derecho", "Defensa Central", "Portero"
    ];

    const listaCanteras = [
      "Real Madrid (La Fábrica)", "FC Barcelona (La Masia)", "Atlético de Madrid", 
      "Athletic Club (Lezama)", "Real Sociedad (Zubieta)", "Valencia CF (Paterna)",
      "Manchester City", "Chelsea FC (Cobham)", "Arsenal FC (Hale End)", "Manchester United",
      "Bayern Múnich", "Borussia Dortmund", "Bayer Leverkusen",
      "Paris Saint-Germain", "Olympique de Lyon", "AS Mónaco",
      "Ajax de Ámsterdam", "PSV Eindhoven", "Feyenoord",
      "SL Benfica (Seixal)", "Sporting de Portugal (Alcochete)", "FC Porto",
      "Juventus", "AC Milan", "Inter de Milán", "Atalanta",
      "River Plate", "Boca Juniors", "Santos FC", "Flamengo"
    ];

    const clubesEuropaTop = [
      "Real Madrid", "FC Barcelona", "Manchester City", "Liverpool FC", 
      "Arsenal FC", "Bayern Múnich", "Paris Saint-Germain", "Inter de Milán", 
      "Juventus", "Atlético de Madrid", "Borussia Dortmund"
    ];

    const clubesEuropaMedios = [
      "Bayer Leverkusen", "Chelsea FC", "Atalanta", "Manchester United", 
      "Tottenham Hotspur", "Aston Villa", "Newcastle United", "AC Milan", 
      "AS Roma", "SSC Napoli", "Sevilla FC", "Real Sociedad", "Athletic Club", 
      "SL Benfica", "Sporting de Portugal", "FC Porto", "Ajax de Ámsterdam"
    ];

    const clubesEuropaBajos = [
      "Valencia CF", "Real Betis", "Villarreal CF", "Girona FC", "Celta de Vigo",
      "West Ham United", "Brighton", "Everton FC", "Wolverhampton",
      "Eintracht Frankfurt", "VfB Stuttgart", "RB Leipzig", "Fiorentina",

    ];

    const clubesExoticos = ["Al-Hilal", "Al-Nassr", "Inter Miami", "LA Galaxy", "Vissel Kobe"];

    let player = {
      nombre: "Álex Navarro",
      dorsal: 10,
      nacionalidad: "",
      posicion: "",
      pieHabil: "",
      club: "",
      edad: 17,
      numeroFicha: 1,
      totalFichas: 11,
      modoJuego: 11,
      retiradoSeleccion: false,
      retiradoFutbol: false,
      motivoRetirada: "",
      media: 67,
      valorMercado: 2.5,
      valorMercadoRecord: 2.5,
      sueldoAnual: 0.5,
      titulosClub: 0,
      titulosSeleccion: 0,
      mundialesGanados: 0,
      continentalesGanados: 0,
      listaTitulos: [],
      partidosTotales: 0,
      golesTotales: 0,
      asistenciasTotales: 0,
      partidosSeleccion: 0,
      golesSeleccion: 0,
      asistenciasSeleccion: 0,
      porteriasCeroTotales: 0,
      pasesCompletadosTotales: 0,
      pasesClaveTotales: 0,
      regatesTotales: 0,
      recuperacionesTotales: 0,
      paradasTotales: 0,
      balonesDeOro: 0,
      botasDeOro: 0,
      guantesDeOro: 0,
      vecesOnceIdeal: 0,
      pichichisLiga: 0,
      pichichisChampions: 0,
      pichichisMundial: 0,
      listaPremiosIndiv: [],
      ultimoEstadoMental: 0,
      ultimoEstadoFisico: 0,
      antecedentes: {
        seOpero: false,
        desobedecioMister: false,
        forzoTraspaso: false
      }
    };

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function pickDistinct(arr, count, exclude = []) {
      const copy = arr.filter(x => !exclude.includes(x));
      const res = [];
      for (let i = 0; i < count; i++) {
        if (!copy.length) break;
        const idx = Math.floor(Math.random() * copy.length);
        res.push(copy.splice(idx, 1)[0]);
      }
      return res;
    }

    function pickRandomExcept(arr, exclude) {
      const filtered = arr.filter(c => c !== exclude);
      return filtered[Math.floor(Math.random() * filtered.length)];
    }

    function calcularFactorDificultadSeleccion(vecesGanado) {
      if (vecesGanado === 0) return 1.0;
      if (vecesGanado === 1) return 0.33;
      return 0.10;
    }

    function obtenerPosicionReconversion(posActual) {
      const mapaEstricto = {
        "Defensa Central": ["Pivote Defensivo", "Lateral Derecho", "Lateral Izquierdo"],
        "Lateral Izquierdo": ["Extremo Izquierdo", "Defensa Central"],
        "Lateral Derecho": ["Extremo Derecho", "Defensa Central"],
        "Pivote Defensivo": ["Defensa Central", "Centrocampista"],
        "Centrocampista": ["Mediapunta", "Pivote Defensivo"],
        "Mediapunta": ["Centrocampista", "Extremo Izquierdo", "Extremo Derecho", "Delantero Centro"],
        "Extremo Izquierdo": ["Delantero Centro", "Mediapunta", "Lateral Izquierdo"],
        "Extremo Derecho": ["Delantero Centro", "Mediapunta", "Lateral Derecho"],
        "Delantero Centro": ["Mediapunta", "Extremo Izquierdo", "Extremo Derecho"]
      };
      const opciones = mapaEstricto[posActual];
      if (!opciones || !opciones.length) return null;
      return pickRandom(opciones);
    }

    function calcularValorMercado() {
      const m = player.media;
      const e = player.edad;
      let base = 0;

      if (m < 70) base = 1 + (m - 60) * 0.4;
      else if (m < 75) base = 5 + (m - 70) * 2;
      else if (m < 80) base = 15 + (m - 75) * 4;
      else if (m < 85) base = 35 + (m - 80) * 8;
      else if (m < 90) base = 75 + (m - 85) * 15;
      else base = 150 + (m - 90) * 25;

      let factorEdad = 1.0;
      if (e <= 21) factorEdad = 1.6;
      else if (e <= 24) factorEdad = 1.4;
      else if (e <= 28) factorEdad = 1.15;
      else if (e <= 30) factorEdad = 0.9;
      else if (e <= 33) factorEdad = 0.55;
      else if (e <= 35) factorEdad = 0.3;
      else factorEdad = 0.12;

      let factorPos = 1.0;
      if (player.posicion.includes("Delantero") || player.posicion.includes("Extremo")) factorPos = 1.15;
      else if (player.posicion === "Portero") factorPos = 0.8;

      let val = Math.max(0.5, Math.round(base * factorEdad * factorPos * 10) / 10);
      player.valorMercado = val;
      if (val > player.valorMercadoRecord) {
        player.valorMercadoRecord = val;
      }

      let factorClub = clubesEuropaTop.includes(player.club) ? 1.3 : (clubesEuropaMedios.includes(player.club) ? 1.0 : 0.7);
      if (clubesExoticos.includes(player.club)) factorClub = 2.4;
      player.sueldoAnual = Math.max(0.3, Math.round((val * 0.11 * factorClub) * 10) / 10);
    }

    function aplicarDeltaMedia(delta) {
      if (delta > 0) {
        if (player.media >= 88) {
          delta = (delta >= 2) ? 1 : 0;
        } else if (player.media >= 83 && delta >= 3) {
          delta = 2;
        }
      }
      player.media = Math.min(99, Math.max(40, player.media + delta));
      calcularValorMercado();
    }

    function obtenerNoticiaContextual() {
      const esAtacante = (player.posicion.includes("Delantero") || player.posicion.includes("Extremo"));
      const esMedio = (player.posicion === "Centrocampista" || player.posicion === "Mediapunta" || player.posicion === "Pivote Defensivo");
      const esDefensa = (player.posicion.includes("Defensa") || player.posicion.includes("Lateral"));
      const esPortero = (player.posicion === "Portero");

      let noticiasPosibles = [];

      // Antecedentes específicos
      if (player.antecedentes.seOpero) {
        noticiasPosibles.push({
          titular: "💉 ¡EL FÍSICO PASA FACTURA: SE RESIENTE DE LA CIRUGÍA!",
          bajada: "Forzaste los plazos de rehabilitación y tu articulación operada cedió al saltar a disputar un balón dividido.",
          opcionA: { txt: "Parar obligatoriamente y guardar reposo estricto", delta: -1, msg: "Priorizas la prudencia para no romperte definitivamente (-1 de media)." },
          opcionB: { txt: "Jugar infiltrado asumiendo el riesgo", delta: -2, msg: "Infiltrarte agrava el edema y la rodilla se inflama (-2 de media)." }
        });
      }
      if (player.antecedentes.desobedecioMister) {
        noticiasPosibles.push({
          titular: "🥶 ¡CASTIGADO A LA GRADA TRAS SU DESOBEDIENCIA AL MÍSTER!",
          bajada: "El entrenador te dejó fuera de la convocatoria del partido decisivo; las cámaras te captan en el palco comiendo pipas.",
          opcionA: { txt: "Aceptar el castigo y pedir una reunión sincera con los capitanes", delta: 0, msg: "Muestras madurez y los veteranos interceden por ti ante el cuerpo técnico." },
          opcionB: { txt: "Subir una foto enigmática a redes cuestionando la alineación", delta: -1, msg: "El club te abre un expediente disciplinario por reincidente (-1 de media)." }
        });
      }
      if (player.antecedentes.forzoTraspaso) {
        noticiasPosibles.push({
          titular: "💵 ¡PANCARTAS Y LLUVIA DE BILLETES FALSOS DESDE EL FONDO SUR!",
          bajada: "La afición te recibe en tu antiguo estadio con billetes falsos con tu cara y cánticos tachándote de pesetero.",
          opcionA: { txt: "Centrarte en el partido y aplaudir con respeto a la grada", delta: 0, msg: "Tu templanza desarma la hostilidad de la afición rival." },
          opcionB: { txt: "Hacer gestos desafiantes llevándote las manos a las orejas", delta: -1, msg: "La tangana resultante te desconcentra del partido (-1 de media)." }
        });
      }
      if (player.retiradoSeleccion) {
        noticiasPosibles.push({
          titular: "🏖️ ¡DE VACACIONES EN DUBÁI MIENTRAS TU PAÍS QUEDA ELIMINADO!",
          bajada: "Tu selección nacional cayó eliminada en primera ronda mientras subías fotos relajándote en un yate privado.",
          opcionA: { txt: "Publicar un mensaje de aliento y cariño a tus excompañeros", delta: 0, msg: "El mensaje apaga la polémica y los aficionados agradecen el gesto." },
          opcionB: { txt: "Reivindicar tu descanso: 'Mi etapa allí ya terminó'", delta: 0, msg: "Generas debate en las tertulias pero reafirmas tu tranquilidad personal." }
