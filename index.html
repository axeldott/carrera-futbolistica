<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11 Fichas: Carrera de Fútbol</title>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --gold: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    #game-container {
      width: 100%;
      max-width: 760px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1, h2, h3 { color: #ffffff; margin-bottom: 14px; font-weight: 800; }
    h1 { font-size: 1.8rem; text-align: center; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.15rem; color: var(--accent); }

    p { line-height: 1.6; margin-bottom: 12px; color: var(--text-main); }
    hr { border: 0; border-top: 1px solid var(--border-color); margin: 20px 0; }

    .tarjeta-ficha {
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .ficha-juvenil {
      background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
      border: 1px solid #38bdf8;
    }

    .ficha-prime {
      background: linear-gradient(135deg, #14532d 0%, #16a34a 100%);
      border: 1px solid #4ade80;
    }

    .ficha-veterano {
      background: linear-gradient(135deg, #78350f 0%, #d97706 100%);
      border: 1px solid #fbbf24;
    }

    .badge-etapa {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .progreso-carrera {
      display: flex;
      gap: 4px;
      margin-top: 10px;
    }

    .progreso-bloque {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .progreso-bloque.activo {
      background: #ffffff;
    }

    .cartel {
      border-radius: 8px;
      padding: 14px 18px;
      margin: 15px 0;
      border-left: 6px solid;
    }

    .cartel-titular {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .cartel-cuerpo {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .cartel-stats {
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 12px;
      border-radius: 6px;
    }

    .cartel-oro {
      background: rgba(234, 179, 8, 0.15);
      border-color: #eab308;
      color: #fef08a;
    }

    .cartel-verde {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      color: #bbf7d0;
    }

    .cartel-azul {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #bfdbfe;
    }

    .cartel-amarillo {
      background: rgba(245, 158, 11, 0.15);
      border-color: #f59e0b;
      color: #fde68a;
    }

    .cartel-rojo {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fecaca;
    }

    .lista-opciones {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
    }

    button.btn-opcion {
      background-color: #1e3a8a;
      color: #ffffff;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.btn-opcion:hover {
      background-color: #2563eb;
      transform: translateY(-1px);
    }

    button.btn-primario {
      background-color: #0284c7;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
    }

    button.btn-primario:hover {
      background-color: #0369a1;
    }

    input[type="text"] {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      margin: 6px 0 16px 0;
    }

    .vitrina-box {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #eab308;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
    }

    .seleccion-box {
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid #3b82f6;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
    }

    .resurreccion-box {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      border: 2px solid #818cf8;
      border-radius: 8px;
      padding: 16px;
      margin: 15px 0;
    }

    .premios-box {
      background: linear-gradient(135deg, #451a03 0%, #78350f 100%);
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 14px;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    const paisesMundo = [
      "España", "Francia", "Alemania", "Inglaterra", "Italia", "Portugal", "Países Bajos", "Croacia",
      "Bélgica", "Noruega", "Polonia", "Turquía", "Grecia", "Islandia",
      "Argentina", "Brasil", "Uruguay", "Colombia", "Chile", "Ecuador", "Paraguay", "Perú",
      "Venezuela", "Bolivia", "México", "Estados Unidos", "Canadá", "Costa Rica",
      "Marruecos", "Senegal", "Nigeria", "Costa de Marfil", "Egipto", "Camerún", "Ghana",
      "Japón", "Corea del Sur", "Australia", "Arabia Saudí"
    ];

    const listaPosiciones = [
      "Delantero Centro", "Extremo Izquierdo", "Extremo Derecho",
      "Mediapunta", "Centrocampista", "Pivote Defensivo",
      "Lateral Izquierdo", "Lateral Derecho", "Defensa Central", "Portero"
    ];

    const listaCanteras = [
      "Real Madrid (La Fábrica)", "FC Barcelona (La Masia)", "Atlético de Madrid", 
      "Athletic Club (Lezama)", "Real Sociedad (Zubieta)", "Valencia CF (Paterna)",
      "Manchester City", "Chelsea FC (Cobham)", "Arsenal FC (Hale End)", "Manchester United",
      "Bayern Múnich", "Borussia Dortmund", "Bayer Leverkusen",
      "Paris Saint-Germain", "Olympique de Lyon", "AS Mónaco",
      "Ajax de Ámsterdam", "PSV Eindhoven", "Feyenoord",
      "SL Benfica (Seixal)", "Sporting de Portugal (Alcochete)", "FC Porto",
      "Juventus", "AC Milan", "Inter de Milán", "Atalanta",
      "River Plate", "Boca Juniors", "Santos FC", "Flamengo"
    ];

    const clubesEuropaTop = [
      "Real Madrid", "FC Barcelona", "Manchester City", "Liverpool FC", 
      "Arsenal FC", "Bayern Múnich", "Paris Saint-Germain", "Inter de Milán", 
      "Juventus", "Atlético de Madrid", "Borussia Dortmund"
    ];

    const clubesEuropaMedios = [
      "Bayer Leverkusen", "Chelsea FC", "Atalanta", "Manchester United", 
      "Tottenham Hotspur", "Aston Villa", "Newcastle United", "AC Milan", 
      "AS Roma", "SSC Napoli", "Sevilla FC", "Real Sociedad", "Athletic Club", 
      "SL Benfica", "Sporting de Portugal", "FC Porto", "Ajax de Ámsterdam"
    ];

    const clubesEuropaBajos = [
      "Valencia CF", "Real Betis", "Villarreal CF", "Girona FC", "Celta de Vigo",
      "West Ham United", "Brighton", "Everton FC", "Wolverhampton",
      "Eintracht Frankfurt", "VfB Stuttgart", "RB Leipzig", "Fiorentina", 
      "Lazio", "LOSC Lille", "AS Mónaco", "Feyenoord"
    ];

    const clubesExoticos = ["Al-Hilal", "Al-Nassr", "Inter Miami", "LA Galaxy", "Vissel Kobe"];

    let player = {
      nombre: "Álex Navarro",
      dorsal: 10,
      nacionalidad: "",
      posicion: "",
      pieHabil: "",
      club: "",
      edad: 17,
      numeroFicha: 1,
      media: 70,
      titulosClub: 0,
      titulosSeleccion: 0,
      listaTitulos: [],
      partidosTotales: 0,
      golesTotales: 0,
      partidosSeleccion: 0,
      golesSeleccion: 0,
      porteriasCeroTotales: 0,
      balonesDeOro: 0,
      botasDeOro: 0,
      guantesDeOro: 0,
      vecesOnceIdeal: 0,
      pichichisLiga: 0,
      pichichisChampions: 0,
      pichichisMundial: 0,
      listaPremiosIndiv: []
    };

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function pickDistinct(arr, count) {
      const copy = [...arr];
      const res = [];
      for (let i = 0; i < count; i++) {
        if (!copy.length) break;
        const idx = Math.floor(Math.random() * copy.length);
        res.push(copy.splice(idx, 1)[0]);
      }
      return res;
    }

    const container = document.getElementById("game-container");

    function renderStart() {
      container.innerHTML = `
        <h1>⚽ 11 FICHAS: CARRERA DE FÚTBOL</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">De Promesa Juvenil a Leyenda del Deporte Rey</p>
        <p>Vive una trayectoria profesional completa de 20 años a lo largo de <strong>11 etapas bianuales</strong> (desde los 17 hasta los 37 años).</p>
        <p>Define tus orígenes, posición, pie hábil y toma decisiones clave dentro y fuera del campo para forjar tu palmarés histórico.</p>
        <hr>
        <button class="btn-primario" onclick="renderNacionalidad()">Comenzar tu carrera profesional</button>
      `;
    }

    function renderNacionalidad() {
      const opciones = pickDistinct(paisesMundo, 3);
      container.innerHTML = `
        <h3>🌍 Paso 1: País de Nacimiento</h3>
        <p>¿Bajo qué bandera darás tus primeros toques al balón?</p>
        <div class="lista-opciones">
          ${opciones.map(p => `<button class="btn-opcion" onclick="elegirNacionalidad('${p}')">Nacer en <strong>${p}</strong></button>`).join('')}
        </div>
      `;
    }

    function elegirNacionalidad(p) {
      player.nacionalidad = p;
      renderPosicion();
    }

    function renderPosicion() {
      const opciones = pickDistinct(listaPosiciones, 3);
      container.innerHTML = `
        <h3>🏃 Paso 2: Posición en el Campo</h3>
        <p><strong>Nacionalidad:</strong> ${player.nacionalidad}</p>
        <p>¿Cuál es tu rol natural sobre el terreno de juego?</p>
        <div class="lista-opciones">
          ${opciones.map(pos => `<button class="btn-opcion" onclick="elegirPosicion('${pos}')">Jugar de <strong>${pos}</strong></button>`).join('')}
        </div>
      `;
    }

    function elegirPosicion(pos) {
      player.posicion = pos;
      renderPie();
    }

    function renderPie() {
      container.innerHTML = `
        <h3>👟 Paso 3: Perfil y Pierna Hábil</h3>
        <p><strong>Nacionalidad:</strong> ${player.nacionalidad} | <strong>Posición:</strong> ${player.posicion}</p>
        <div class="lista-opciones">
          <button class="btn-opcion" onclick="elegirPie('Diestro')">Pierna derecha (Diestro)</button>
          <button class="btn-opcion" onclick="elegirPie('Zurdo')">Pierna izquierda (Zurdo)</button>
          <button class="btn-opcion" onclick="elegirPie('Ambidiestro')">Dominio de ambas piernas (Ambidiestro)</button>
        </div>
      `;
    }

    function elegirPie(pie) {
      player.pieHabil = pie;
      renderDatos();
    }

    function renderDatos() {
      const defDorsal = randomInt(1, 99);
      container.innerHTML = `
        <h3>✍️ Paso 4: Identidad y Dorsal</h3>
        <p><strong>Nacionalidad:</strong> ${player.nacionalidad} | <strong>Posición:</strong> ${player.posicion} | <strong>Pierna:</strong> ${player.pieHabil}</p>
        <label>Nombre de futbolista:</label>
        <input type="text" id="inputNombre" value="Álex Navarro">
        <label>Dorsal predilecto:</label>
        <input type="text" id="inputDorsal" value="${defDorsal}">
        <button class="btn-primario" onclick="guardarDatos()">Firmar ficha y buscar academia</button>
      `;
    }

    function guardarDatos() {
      const n = document.getElementById("inputNombre").value.trim();
      const d = parseInt(document.getElementById("inputDorsal").value.trim(), 10);
      if (n) player.nombre = n;
      if (!isNaN(d)) player.dorsal = d;
      renderCantera();
    }

    function renderCantera() {
      const opciones = pickDistinct(listaCanteras, 3);
      container.innerHTML = `
        <h3>🏟️ Paso 5: Academia de Formación</h3>
        <p><strong>Futbolista:</strong> ${player.nombre} (#${player.dorsal}) | ${player.posicion}</p>
        <p>Tres academias de prestigio internacional envían a sus ojeadores a ficharte a los 17 años:</p>
        <div class="lista-opciones">
          ${opciones.map(c => `<button class="btn-opcion" onclick="elegirCantera('${c}')">Formarte en la cantera de <strong>${c}</strong></button>`).join('')}
        </div>
      `;
    }

    function elegirCantera(c) {
      player.club = c;
      player.edad = 17;
      player.numeroFicha = 1;
      player.media = randomInt(64, 73);
      renderFichaInicial();
    }

    function renderFichaInicial() {
      container.innerHTML = `
        <h3>📋 Ficha Inicial Oficial: Inicio de Carrera</h3>
        <div style="background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 18px; margin: 15px 0; line-height: 1.8;">
          <p><strong>Nombre:</strong> ${player.nombre} (#${player.dorsal})</p>
          <p><strong>Nacionalidad:</strong> ${player.nacionalidad} | <strong>Posición:</strong> ${player.posicion}</p>
          <p><strong>Pierna hábil:</strong> ${player.pieHabil}</p>
          <p><strong>Club inicial:</strong> ${player.club}</p>
          <p><strong>Edad inicial:</strong> 17 años</p>
          <p><strong>Media inicial de salida:</strong> ${player.media} / 99</p>
        </div>
        <p>El cuerpo técnico te incluye en la convocatoria del primer equipo para tu debut oficial.</p>
        <button class="btn-primario" onclick="simularFicha()">Debut profesional: Saltar al césped (Ficha 1)</button>
      `;
    }

    function simularFicha() {
      let claseFicha = "ficha-juvenil";
      let nombreEtapa = "JUVENIL // PROMESA";
      if (player.numeroFicha > 7) {
        claseFicha = "ficha-veterano";
        nombreEtapa = "VETERANO // LEYENDA";
      } else if (player.numeroFicha > 3) {
        claseFicha = "ficha-prime";
        nombreEtapa = "PRIME // ÉLITE MUNDIAL";
      }

      const suerte = randomInt(1, 100);
      let nuevosTitulos = [];
      let porteriasCero = 0;
      const esAtacante = (player.posicion.includes("Delantero") || player.posicion.includes("Extremo") || player.posicion.includes("Mediapunta"));
      const esClubChampions = clubesEuropaTop.includes(player.club);
      const esClubEuropaLeague = clubesEuropaMedios.includes(player.club);

      let subida = 0;
      let partidos = 0;
      let goles = 0;
      let htmlRendimiento = "";

      if (suerte >= 80) {
        subida = (player.numeroFicha <= 3) ? randomInt(5, 8) : ((player.numeroFicha <= 7) ? randomInt(3, 5) : randomInt(0, 1));
        player.media = Math.min(99, Math.max(40, player.media + subida));
        partidos = randomInt(65, 80);

        if (player.posicion === "Portero") {
          goles = 0;
          porteriasCero = randomInt(28, 42);
          player.porteriasCeroTotales += porteriasCero;
        } else if (player.posicion.includes("Defensa") || player.posicion.includes("Lateral")) {
          goles = randomInt(1, 4);
          porteriasCero = randomInt(24, 38);
          player.porteriasCeroTotales += porteriasCero;
        } else if (player.posicion.includes("Pivote")) {
          goles = randomInt(3, 8);
        } else if (player.posicion.includes("Centro")) {
          goles = randomInt(10, 18);
        } else if (player.posicion.includes("Mediapunta")) {
          goles = randomInt(16, 26);
        } else {
          goles = randomInt(38, 56);
        }

        htmlRendimiento = `
          <div class="cartel cartel-oro">
            <div class="cartel-titular">🌟 RENDIMIENTO DE CLASE MUNDIAL</div>
            <div class="cartel-cuerpo">Has dominado las competiciones con autoridad. El cuerpo técnico y la afición se rinden a tu nivel en cada partido decisivo.</div>
            <div class="cartel-stats">
              📊 Bloque de 2 años: ${partidos} partidos | ${goles} goles ${porteriasCero > 0 ? `| 🧤 ${porteriasCero} porterías a cero` : ''}<br>
              📈 Progresión en cancha: <strong>+${subida} de media</strong> (Nueva media: ${player.media})
            </div>
          </div>
        `;

        if (randomInt(1, 100) <= 75) nuevosTitulos.push("Liga Nacional");
        if (randomInt(1, 100) <= 65) nuevosTitulos.push("Copa Doméstica");
        if (esClubChampions && player.media >= 80 && randomInt(1, 100) <= 50) nuevosTitulos.push("UEFA Champions League");
        else if (esClubEuropaLeague && player.media >= 75 && randomInt(1, 100) <= 65) nuevosTitulos.push("UEFA Europa League");

      } else if (suerte >= 50) {
        subida = (player.numeroFicha <= 3) ? randomInt(3, 5) : ((player.numeroFicha <= 7) ? randomInt(1, 3) : 0);
        player.media = Math.min(99, Math.max(40, player.media + subida));
        partidos = randomInt(55, 68);

        if (player.posicion === "Portero") {
          goles = 0;
          porteriasCero = randomInt(20, 30);
          player.porteriasCeroTotales += porteriasCero;
        } else if (player.posicion.includes("Defensa") || player.posicion.includes("Lateral")) {
          goles = randomInt(1, 3);
          porteriasCero = randomInt(16, 26);
          player.porteriasCeroTotales += porteriasCero;
        } else if (player.posicion.includes("Pivote")) {
          goles = randomInt(2, 5);
        } else if (player.posicion.includes("Centro")) {
          goles = randomInt(7, 12);
        } else if (player.posicion.includes("Mediapunta")) {
          goles = randomInt(12, 19);
        } else {
          goles = randomInt(22, 35);
        }

        htmlRendimiento = `
          <div class="cartel cartel-verde">
            <div class="cartel-titular">📈 CONSOLIDACIÓN Y NOTABLE ALTO</div>
            <div class="cartel-cuerpo">Gran regularidad y disciplina táctica. Eres un fijo en las alineaciones titulares aportando solvencia continua.</div>
            <div class="cartel-stats">
              📊 Bloque de 2 años: ${partidos} partidos | ${goles} goles ${porteriasCero > 0 ? `| 🧤 ${porteriasCero} porterías a cero` : ''}<br>
              📈 Progresión en cancha: <strong>+${subida} de media</strong> (Nueva media: ${player.media})
            </div>
          </div>
        `;

        if (randomInt(1, 100) <= 55) nuevosTitulos.push("Copa Doméstica");
        if (randomInt(1, 100) <= 45 && player.media >= 78) nuevosTitulos.push("Liga Nacional");
        if (esClubEuropaLeague && player.media >= 77 && randomInt(1, 100) <= 50) nuevosTitulos.push("UEFA Europa League");
        else if (esClubChampions && player.media >= 83 && randomInt(1, 100) <= 35) nuevosTitulos.push("UEFA Champions League");

      } else if (suerte >= 25) {
        subida = (player.numeroFicha <= 3) ? randomInt(1, 3) : ((player.numeroFicha <= 7) ? 0 : -1);
        player.media = Math.min(99, Math.max(40, player.media + subida));
        partidos = randomInt(40, 54);

        if (player.posicion === "Portero") {
          goles = 0;
          porteriasCero = randomInt(14, 22);
          player.porteriasCeroTotales += porteriasCero;
        } else if (player.posicion.includes("Defensa") || player.posicion.includes("Lateral")) {
          goles = randomInt(0, 2);
          porteriasCero = randomInt(12, 20);
          player.porteriasCeroTotales += porteriasCero;
        } else if (player.posicion.includes("Pivote")) {
          goles = randomInt(1, 3);
        } else if (player.posicion.includes("Centro")) {
          goles = randomInt(4, 7);
        } else if (player.posicion.includes("Mediapunta")) {
          goles = randomInt(7, 12);
        } else {
          goles = randomInt(12, 22);
        }

        htmlRendimiento = `
          <div class="cartel cartel-azul">
            <div class="cartel-titular">📋 TRAYECTORIA CORRECTA Y TRABAJADA</div>
            <div class="cartel-cuerpo">Cumpliste con el papel asignado alternando titularidades con rotaciones para dar descanso al plantel.</div>
            <div class="cartel-stats">
              📊 Bloque de 2 años: ${partidos} partidos | ${goles} goles ${porteriasCero > 0 ? `| 🧤 ${porteriasCero} porterías a cero` : ''}<br>
              📈 Progresión en cancha: <strong>${subida >= 0 ? '+' : ''}${subida} de media</strong> (Nueva media: ${player.media})
            </div>
          </div>
        `;

        if (randomInt(1, 100) <= 45) nuevosTitulos.push("Copa Doméstica");

      } else {
        subida = (player.numeroFicha <= 3) ? -1 : ((player.numeroFicha <= 7) ? -2 : -3);
        player.media = Math.min(99, Math.max(40, player.media + subida));
        partidos = randomInt(12, 28);

        if (player.posicion === "Portero" || player.posicion.includes("Defensa") || player.posicion.includes("Pivote")) {
          goles = 0;
          porteriasCero = randomInt(2, 6);

              ⌛ <strong>RECTA FINAL DE CARRERA:</strong> El club prepara la transición y hay ofertas sobre la mesa.
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarDecision({club: '${exotico}'})">Aceptar un retiro dorado en el <strong>${exotico}</strong> (Contrato multimillonario)</button>
              <button class="btn-opcion" onclick="ejecutarDecision({club: '${modesto}'})">Fichar por un club modesto como el <strong>${modesto}</strong> (Aportar tu jerarquía)</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Pelear por tu puesto y quedarte hasta el final en el <strong>${player.club}</strong></button>
            </div>
          `;
        } else {
          htmlOpciones = `
            <div style="background: rgba(16, 185, 129, 0.15); border-left: 4px solid #10b981; padding: 14px; margin: 15px 0;">
              🥗 <strong>PLAN DE REGENERACIÓN FÍSICA PARA VETERANOS</strong><br>
              A tus ${player.edad} años, te ofrecen un protocolo biológico para cuidar las articulaciones.<br>
              <small style="color: #94a3b8;">(Riesgo: 75% éxito +1 / 25% bajón físico -1)</small>
            </div>
            <div class="lista-opciones">
              <button class="btn-opcion" onclick="ejecutarRegeneracion()">Someterte al plan regenerativo</button>
              <button class="btn-opcion" onclick="ejecutarDecision({})">Confiar en tus rutinas de siempre</button>
            </div>
          `;
        }
      }

      container.innerHTML = `
        <h3>💼 Despacho y Decisiones de Futuro</h3>
        <p><strong>Situación:</strong> ${player.nombre} (#${player.dorsal}) | <strong>Edad:</strong> ${player.edad} años | <strong>Club:</strong> ${player.club} | <strong>Media:</strong> ${player.media}</p>
        <p>Tu agente te presenta las opciones antes de saltar a disputar la siguiente etapa:</p>
        <hr>
        ${htmlOpciones}
      `;
    }

    function ejecutarDecision(opts) {
      if (opts.club) player.club = opts.club;
      if (opts.mediaDelta) player.media = Math.min(99, Math.max(40, player.media + opts.mediaDelta));
      player.edad += 2;
      player.numeroFicha += 1;
      simularFicha();
    }

    function ejecutarPresionJoven() {
      const delta = (randomInt(1, 100) <= 85) ? 2 : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarPresionPrime() {
      const delta = (randomInt(1, 100) <= 75) ? pickRandom([1, 2]) : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarPresionVeterano() {
      const delta = (randomInt(1, 100) <= 50) ? 1 : -2;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarDieta() {
      const delta = (randomInt(1, 100) <= 75) ? pickRandom([1, 2]) : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarMentor() {
      const delta = (randomInt(1, 100) <= 80) ? pickRandom([1, 2]) : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function ejecutarRegeneracion() {
      const delta = (randomInt(1, 100) <= 75) ? 1 : -1;
      ejecutarDecision({mediaDelta: delta});
    }

    function renderFin() {
      const totTitulos = player.titulosClub + player.titulosSeleccion;
      const esAtacante = (player.posicion.includes("Delantero") || player.posicion.includes("Extremo") || player.posicion.includes("Mediapunta"));

      let veredicto = "";
      if (player.balonesDeOro >= 2) {
        veredicto = "🐐 <strong>EL MAYOR DE TODOS LOS TIEMPOS (G.O.A.T.):</strong> Múltiples Balones de Oro te colocan en el Olimpo absoluto del fútbol junto a los más grandes de la historia.";
      } else if (player.balonesDeOro === 1 || player.botasDeOro >= 2 || player.guantesDeOro >= 1 || player.pichichisMundial >= 1) {
        veredicto = "👑 <strong>ESTRELLA GENERACIONAL:</strong> Alcanzaste la cima del planeta y fuiste el líder absoluto de tu época dorada.";
      } else if (totTitulos >= 6) {
        veredicto = "⭐ <strong>COLECCIONISTA DE COPAS:</strong> Un ganador nato que llenó las vitrinas de los clubes por donde pasó.";
      } else {
        veredicto = "⚽ <strong>CARRERA PROFESIONAL DE ÉLITE:</strong> Competiste con honor al máximo nivel internacional durante dos décadas completas.";
      }

      container.innerHTML = `
        <h1>🏆 Fin de la Carrera Profesional: ${player.nombre}</h1>
        <p>A los <strong>${player.edad} años</strong>, cuelgas las botas definitivamente. Así queda el legado de tu carrera tras disputar tus 11 etapas oficiales:</p>

        <div style="background: #1e293b; padding: 20px; border-radius: 8px; margin: 20px 0; line-height: 1.8;">
          <p>• <strong>Nombre:</strong> ${player.nombre} (#${player.dorsal})</p>
          <p>• <strong>Nacionalidad:</strong> ${player.nacionalidad} | <strong>Posición:</strong> ${player.posicion} | <strong>Pierna:</strong> ${player.pieHabil}</p>
          <p>• <strong>Media final de retirada:</strong> ${player.media} / 99</p>
          <p>• <strong>Partidos oficiales en clubes:</strong> ${player.partidosTotales} | <strong>Goles:</strong> ${player.golesTotales}</p>
          ${(player.posicion === "Portero" || player.posicion.includes("Defensa")) ? `<p>• <strong>Porterías a cero acumuladas:</strong> ${player.porteriasCeroTotales}</p>` : ''}
          <p>• <strong>Internacional con ${player.nacionalidad}:</strong> ${player.partidosSeleccion} partidos (${player.golesSeleccion} goles)</p>
          <p>• <strong>Total de Títulos Colectivos:</strong> ${totTitulos} (Club: ${player.titulosClub} | Selección: ${player.titulosSeleccion})</p>
          <p>• <strong>Distinciones individuales:</strong> 🟡 ${player.balonesDeOro} Balones de Oro | 👟 ${player.botasDeOro} Botas de Oro | 🧤 ${player.guantesDeOro} Guantes de Oro | ⭐ ${player.vecesOnceIdeal} Once Ideal FIFPRO</p>
          ${esAtacante ? `<p>• <strong>Trofeos de Máximo Goleador:</strong> ⚽ ${player.pichichisLiga} Pichichis de Liga | ⚽ ${player.pichichisChampions} Goleador de Champions \vert{} ⚽${player.pichichisMundial} Botas de Oro en Mundiales</p>` : ''}
        </div>

        <h3>🏅 Vitrina de Títulos Colectivos:</h3>
        <div style="margin: 10px 0;">
          ${player.listaTitulos.length ? player.listaTitulos.map(t => `<p>• ${t}</p>`).join('') : '<p><em>No lograste levantar ningún título colectivo en tu carrera.</em></p>'}
        </div>

        <hr>
        <h3>🎖️ Historial de Galardones Individuales:</h3>
        <div style="margin: 10px 0;">
          ${player.listaPremiosIndiv.length ? player.listaPremiosIndiv.map(pr => `<p>• ${pr}</p>`).join('') : '<p><em>No lograste cosechar premios individuales de máxima categoría.</em></p>'}
        </div>

        <hr>
        <h3>Veredicto Histórico:</h3>
        <p style="font-size: 1.05rem; margin: 12px 0;">${veredicto}</p>

        <button class="btn-primario" onclick="location.reload()">Jugar una nueva carrera desde cero</button>
      `;
    }

    // Iniciar juego
    renderStart();
  </script>
</body>
</html>
